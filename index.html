<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"> <meta name="theme-color" content="#0b0b0d"> <meta name="description" content="BM Learn AI - Ghana SHS Business Management learning platform"> <title>BM Learn AI | Business Management</title> <style> :root{ --bg:#08090b; --panel:#111318; --panel2:#17191f; --gold:#d4af37; --gold2:#f3d36a; --white:#f7f7f4; --muted:#a9abb3; --line:#292c34; --green:#48d597; --red:#ff6b6b; --blue:#69a9ff; --shadow:0 18px 50px rgba(0,0,0,.35); --radius:20px; } *{box-sizing:border-box} html{scroll-behavior:smooth} body{ margin:0; background: radial-gradient(circle at top right,rgba(212,175,55,.10),transparent 28%), radial-gradient(circle at bottom left,rgba(105,169,255,.06),transparent 25%), var(--bg); color:var(--white); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.6; } button,input,select,textarea{font:inherit} button{ cursor:pointer; border:0; } a{color:inherit} .app{ min-height:100vh; } .header{ position:sticky; top:0; z-index:100; background:rgba(8,9,11,.92); backdrop-filter:blur(18px); border-bottom:1px solid var(--line); } .header-inner{ max-width:1180px; margin:auto; min-height:72px; padding:12px 16px; display:flex; align-items:center; gap:12px; } .brand{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; } .logo{ width:45px; height:45px; border-radius:14px; display:grid; place-items:center; background:linear-gradient(135deg,var(--gold),#8d6d13); color:#090909; font-weight:900; box-shadow:0 8px 25px rgba(212,175,55,.18); } .brand-text{ min-width:0; } .brand-text strong{ display:block; font-size:17px; letter-spacing:.2px; } .brand-text span{ color:var(--muted); font-size:11px; } .role-switch{ display:flex; background:#15171c; border:1px solid var(--line); border-radius:999px; padding:3px; } .role-btn{ background:transparent; color:var(--muted); padding:8px 10px; border-radius:999px; font-size:12px; font-weight:800; white-space:nowrap; } .role-btn.active{ color:#090909; background:var(--gold); } .icon-btn{ width:42px; height:42px; border-radius:13px; background:var(--panel2); color:var(--white); border:1px solid var(--line); } .menu{ display:none; position:absolute; right:14px; top:68px; width:min(310px,calc(100vw - 28px)); background:#101217; border:1px solid var(--line); border-radius:18px; padding:10px; box-shadow:var(--shadow); } .menu.open{display:block} .menu button{ width:100%; text-align:left; background:transparent; color:var(--white); padding:13px 12px; border-radius:12px; } .menu button:hover{ background:#1a1d23; } .main{ max-width:1180px; margin:auto; padding:20px 15px 70px; } .hero{ padding:30px 0 20px; } .hero-card{ border:1px solid var(--line); background: linear-gradient(135deg,rgba(212,175,55,.13),rgba(255,255,255,.02)), var(--panel); border-radius:28px; padding:28px 22px; box-shadow:var(--shadow); overflow:hidden; position:relative; } .hero-card:after{ content:""; position:absolute; width:180px; height:180px; border-radius:50%; border:1px solid rgba(212,175,55,.14); right:-50px; top:-70px; } .eyebrow{ color:var(--gold2); text-transform:uppercase; letter-spacing:1.5px; font-weight:900; font-size:11px; } h1,h2,h3,h4{ line-height:1.2; } .hero h1{ font-size:clamp(30px,8vw,54px); margin:10px 0; max-width:760px; } .hero p{ color:var(--muted); max-width:760px; margin-bottom:20px; } .actions{ display:flex; flex-wrap:wrap; gap:10px; } .btn{ padding:12px 16px; border-radius:13px; font-weight:850; transition:.18s ease; } .btn:hover{ transform:translateY(-1px); } .btn-primary{ background:var(--gold); color:#090909; } .btn-secondary{ background:var(--panel2); color:var(--white); border:1px solid var(--line); } .btn-danger{ background:rgba(255,107,107,.12); color:#ff9090; border:1px solid rgba(255,107,107,.25); } .section{ margin-top:28px; } .section-head{ display:flex; align-items:end; justify-content:space-between; gap:12px; margin-bottom:13px; } .section-head h2{ margin:0; font-size:22px; } .section-head p{ margin:4px 0 0; color:var(--muted); font-size:13px; } .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; } .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:0 8px 25px rgba(0,0,0,.12); } .card h3{ margin:7px 0 8px; } .card p{ color:var(--muted); font-size:14px; } .card-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; } .badge{ display:inline-flex; align-items:center; padding:5px 9px; border-radius:999px; background:rgba(212,175,55,.10); border:1px solid rgba(212,175,55,.20); color:var(--gold2); font-size:10px; font-weight:900; } .topic-card{ cursor:pointer; transition:.2s; } .topic-card:hover{ transform:translateY(-3px); border-color:rgba(212,175,55,.4); } .progress-wrap{ height:9px; background:#202229; border-radius:999px; overflow:hidden; } .progress-bar{ height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--gold2)); border-radius:999px; transition:.4s; } .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; } .stat{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:15px; } .stat strong{ display:block; font-size:24px; } .stat span{ color:var(--muted); font-size:11px; } .search-row{ display:flex; gap:10px; flex-wrap:wrap; } .input,.select,.textarea{ width:100%; background:#0d0f13; color:var(--white); border:1px solid var(--line); border-radius:13px; padding:12px 13px; outline:none; } .input:focus,.select:focus,.textarea:focus{ border-color:var(--gold); } .search-box{ flex:1; min-width:200px; } .filters{ display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; } .filter{ white-space:nowrap; background:var(--panel2); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:8px 12px; } .filter.active{ background:var(--gold); color:#080808; } .hidden{display:none!important} .modal{ position:fixed; inset:0; z-index:500; display:none; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.72); backdrop-filter:blur(7px); } .modal.open{display:flex} .modal-box{ width:min(900px,100%); max-height:92vh; overflow:auto; background:#0e1014; border:1px solid var(--line); border-radius:24px 24px 0 0; box-shadow:var(--shadow); } .modal-head{ position:sticky; top:0; z-index:2; background:rgba(14,16,20,.96); backdrop-filter:blur(15px); border-bottom:1px solid var(--line); padding:15px 17px; display:flex; justify-content:space-between; align-items:center; gap:12px; } .modal-body{ padding:18px; } .close{ background:#1b1e24; color:white; width:38px; height:38px; border-radius:11px; } .lesson-section{ background:#12151a; border:1px solid #252932; border-radius:17px; padding:17px; margin-bottom:12px; } .lesson-section h3{ margin:0 0 9px; color:var(--gold2); font-size:17px; } .lesson-section p{ color:#d5d6da; margin:7px 0; } .lesson-section ul, .lesson-section ol{ padding-left:22px; } .lesson-section li{ margin:7px 0; color:#d5d6da; } .key-box{ border-left:3px solid var(--gold); padding:12px 14px; background:rgba(212,175,55,.06); border-radius:0 12px 12px 0; } .case{ background: linear-gradient(135deg,rgba(105,169,255,.07),rgba(212,175,55,.05)), #11141a; border:1px solid #2a303b; border-radius:17px; padding:17px; margin-top:12px; } .case h4{ margin:0 0 8px; color:#8dbaff; } .think{ border:1px dashed rgba(212,175,55,.5); background:rgba(212,175,55,.04); border-radius:15px; padding:15px; margin-top:12px; } .think strong{ color:var(--gold2); } .essay-list{ counter-reset:essay; } .essay-item{ background:#101318; border:1px solid var(--line); border-radius:14px; padding:13px; margin:8px 0; } .essay-item b{ color:var(--gold2); } .option{ display:block; width:100%; text-align:left; padding:13px; background:#12151a; color:white; border:1px solid var(--line); border-radius:12px; margin:8px 0; } .option:hover{ border-color:var(--gold); } .result{ border-radius:16px; padding:17px; background:rgba(72,213,151,.07); border:1px solid rgba(72,213,151,.25); } .exam-sheet{ background:#fff; color:#111; padding:30px; border-radius:10px; } .exam-sheet h1,.exam-sheet h2,.exam-sheet h3{ color:#111; } .exam-sheet p,.exam-sheet li{ color:#222; } .ai-output{ white-space:pre-wrap; background:#0a0c0f; border:1px solid var(--line); border-radius:15px; padding:16px; color:#e9e9e9; } .scan-preview{ width:100%; max-height:330px; object-fit:contain; background:#050607; border-radius:16px; border:1px solid var(--line); display:none; } .empty{ text-align:center; padding:30px; color:var(--muted); } .footer{ text-align:center; color:#777b84; padding:30px 15px; font-size:12px; } .toast{ position:fixed; z-index:999; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none; background:#f1f1ef; color:#111; padding:11px 16px; border-radius:999px; font-size:13px; font-weight:800; transition:.25s; max-width:90%; text-align:center; } .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); } @media(max-width:850px){ .grid{grid-template-columns:repeat(2,1fr)} } @media(max-width:620px){ .header-inner{padding:10px 11px} .role-btn{padding:7px 8px;font-size:10px} .brand-text span{display:none} .main{padding:14px 11px 50px} .hero-card{padding:23px 17px;border-radius:22px} .grid{grid-template-columns:1fr} .stats{grid-template-columns:repeat(2,1fr)} .modal{align-items:flex-end} .modal-box{max-height:94vh} .modal-body{padding:14px} } @media print{ body{background:white!important;color:black!important} body *{visibility:hidden!important} #printArea,#printArea *{visibility:visible!important} #printArea{ position:absolute; left:0; top:0; width:100%; } } </style> </head> <body> <div class="app"> <header class="header"> <div class="header-inner"> <div class="brand"> <div class="logo">BM</div> <div class="brand-text"> <strong>BM Learn AI</strong> <span>Ghana SHS Business Management</span> </div> </div> <div class="role-switch" aria-label="Choose role"> <button class="role-btn active" data-role="student">🎓 Student</button> <button class="role-btn" data-role="teacher">👨🏽‍🏫 Teacher</button> </div> <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button> <nav class="menu" id="menu"> <button data-page="home">🏠 Home</button> <button data-page="topics">📚 Topics</button> <button data-page="practice">📝 Practice</button> <button data-page="scanner">📸 Scan Question</button> <button data-page="assistant">🤖 BM Thinking Assistant</button> <button data-page="teacher" data-teacher-only>👨🏽‍🏫 Teacher Centre</button> <button data-page="about">ℹ️ About BM Learn AI</button> <button data-page="settings">⚙️ Settings</button> </nav> </div> </header> <main class="main" id="main"></main> <footer class="footer"> BM Learn AI • Learn • Think • Apply • Excel </footer> </div> <div class="modal" id="modal"> <div class="modal-box"> <div class="modal-head"> <strong id="modalTitle">BM Learn AI</strong> <button class="close" id="closeModal">✕</button> </div> <div class="modal-body" id="modalBody"></div> </div> </div> <div class="toast" id="toast"></div> <input id="scanInput" type="file" accept="image/*" capture="environment" class="hidden" > <script> "use strict"; /* ============================================================ BM LEARN AI CLEAN SINGLE-FILE EDUCATIONAL APP ============================================================ */ const APP = { role: localStorage.getItem("bm_role") || "student", page: "home", topicFilter: "ALL", topicSearch: "", completed: JSON.parse(localStorage.getItem("bm_completed_topics") || "[]"), practiceScore: Number(localStorage.getItem("bm_practice_score") || 0), practiceAttempts: Number(localStorage.getItem("bm_practice_attempts") || 0), currentTopic: null, examSet: 1, examQuestions: [], scanImage: "" }; const $ = (selector) => document.querySelector(selector); const $$ = (selector) => [...document.querySelectorAll(selector)]; function safeText(value){ return String(value ?? ""); } function escapeHTML(value){ return safeText(value) .replaceAll("&","&amp;") .replaceAll("<","&lt;") .replaceAll(">","&gt;") .replaceAll('"',"&quot;") .replaceAll("'","&#039;"); } function toast(message){ const t = $("#toast"); if(!t) return; t.textContent = message; t.classList.add("show"); clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(()=>t.classList.remove("show"),2600); } function openModal(title, html){ $("#modalTitle").textContent = title; $("#modalBody").innerHTML = html; $("#modal").classList.add("open"); document.body.style.overflow = "hidden"; } function closeModal(){ $("#modal").classList.remove("open"); document.body.style.overflow = ""; } function saveState(){ localStorage.setItem("bm_role", APP.role); localStorage.setItem("bm_completed_topics", JSON.stringify(APP.completed)); localStorage.setItem("bm_practice_score", String(APP.practiceScore)); localStorage.setItem("bm_practice_attempts", String(APP.practiceAttempts)); } function setRole(role){ APP.role = role; saveState(); $$(".role-btn").forEach(btn=>{ btn.classList.toggle("active", btn.dataset.role === role); }); render(); toast(role === "teacher" ? "Teacher interface activated 👨🏽‍🏫" : "Student interface activated 🎓"); } function navigate(page){ if(page === "teacher" && APP.role !== "teacher"){ toast("Switch to Teacher mode first."); return; } APP.page = page; $("#menu").classList.remove("open"); window.scrollTo({top:0,behavior:"smooth"}); render(); } function markComplete(topicId){ if(!APP.completed.includes(topicId)){ APP.completed.push(topicId); saveState(); toast("Topic marked as completed ✅"); }else{ APP.completed = APP.completed.filter(x=>x !== topicId); saveState(); toast("Topic removed from completed list."); } render(); } function progressPercent(){ return Math.round((APP.completed.length / topics.length) * 100); } /* ============================================================ TOPIC CONTENT ============================================================ */ const topics = [ { id:"forms", name:"Forms of Business", level:"SHS1", icon:"🏢", meaning:"Forms of business describe the legal and ownership structures through which business activities are organised, controlled and financed.", objective:"By the end of this lesson, learners should be able to identify major forms of business, explain how they are formed, discuss their features, importance, advantages and limitations, and recommend an appropriate form for a particular business situation.", intro:[ "A business does not operate in only one ownership structure. The form chosen affects who owns the business, who controls it, how capital is raised, who receives profits, who bears losses and how long the business can continue.", "The major forms considered in Business Management include sole proprietorship, partnership, companies and state-owned enterprises. The choice should depend on the size and nature of the business, capital requirements, risk, desired control and legal considerations." ], sections:[ { title:"1. Sole Proprietorship", html:` <p><b>Meaning:</b> A sole proprietorship is a business owned and normally controlled by one person who provides the capital and takes responsibility for the business.</p> <p><b>How it is formed:</b> The owner identifies a business opportunity, prepares the required capital, chooses a business name where appropriate, completes relevant registration/formalisation requirements and begins operations. The exact registration requirements depend on the nature of the activity and applicable Ghanaian law.</p> <p><b>Key features:</b></p> <ul> <li>Single ownership.</li> <li>The owner normally takes the major decisions.</li> <li>Easy and relatively inexpensive to establish compared with more complex structures.</li> <li>The owner receives the residual profit.</li> <li>The business is closely connected to its owner.</li> <li>The owner may have unlimited personal liability for business obligations depending on the legal structure.</li> </ul> <p><b>Importance:</b> It encourages entrepreneurship because an individual can convert an idea or skill into a business without first building a large ownership structure. It also allows quick decisions and close contact with customers.</p> <p><b>Advantages:</b> Easy decision-making, privacy, flexibility, personal motivation and close customer relationships.</p> <p><b>Limitations:</b> Limited capital, heavy dependence on the owner, limited managerial capacity and potentially high personal financial risk.</p> ` }, { title:"2. Partnership", html:` <p><b>Meaning:</b> A partnership is a business arrangement in which two or more persons agree to carry on a business and share its results according to their agreement and applicable law.</p> <p><b>How it is formed:</b> Potential partners identify the business, agree on contributions and responsibilities, decide how profits and losses will be shared, prepare an appropriate partnership agreement or deed and complete relevant registration/formalisation requirements.</p> <p><b>Key features:</b></p> <ul> <li>Two or more owners.</li> <li>Partners contribute capital, skills, property or other resources.</li> <li>Management responsibilities may be shared.</li> <li>Profit and loss sharing follows the agreement and applicable law.</li> <li>Mutual trust is important.</li> <li>The legal consequences of partnership debts depend on the type of partnership and applicable law.</li> </ul> <p><b>Importance:</b> Partnership combines resources and skills. One partner may provide finance while another provides technical knowledge, marketing ability or professional expertise.</p> <p><b>Advantages:</b> More resources than one individual may provide, shared responsibilities, wider expertise and greater ability to divide tasks.</p> <p><b>Limitations:</b> Possible disagreements, slower decisions where partners cannot agree, shared profits and possible liability risks.</p> ` }, { title:"3. Companies", html:` <p><b>Meaning:</b> A company is an incorporated business organisation recognised as a legal entity separate from its owners, subject to the applicable company law.</p> <p><b>How it is formed:</b> Promoters decide the business purpose and structure, prepare the required incorporation information and documents, register/incorporate the company with the appropriate authority, establish ownership and management arrangements, and then commence operations after meeting relevant legal requirements.</p> <p><b>Key features:</b></p> <ul> <li>Separate legal personality.</li> <li>Ownership represented by shares in companies where applicable.</li> <li>Management can be separated from ownership.</li> <li>Continuity can exist independently of changes in individual shareholders.</li> <li>Limited liability may protect shareholders from personal liability beyond their investment, subject to the law and circumstances.</li> <li>Companies are subject to formal legal and reporting requirements.</li> </ul> <p><b>Importance:</b> Companies can mobilise substantial capital, support large-scale operations, provide continuity and separate business assets from owners in accordance with law.</p> <p><b>Advantages:</b> Greater access to capital, continuity, limited liability in appropriate structures and ability to employ specialist managers.</p> <p><b>Limitations:</b> More expensive/formal establishment, regulatory obligations, record-keeping requirements and possible separation between owners and managers.</p> ` }, { title:"4. State-Owned Enterprise", html:` <p><b>Meaning:</b> A state-owned enterprise is an organisation owned or controlled by government and established to provide goods, services or strategic economic functions.</p> <p><b>How it is formed:</b> It may be established through government policy, legislation or another legally recognised process depending on the enterprise.</p> <p><b>Key features:</b></p> <ul> <li>Government ownership or controlling interest.</li> <li>May pursue commercial and public-interest objectives.</li> <li>Can operate in strategically important sectors.</li> <li>Management may be appointed through public-sector governance arrangements.</li> <li>May be accountable to government and the public.</li> </ul> <p><b>Importance:</b> State enterprises may provide essential services, support national development, create employment and operate where government considers private provision alone insufficient.</p> <p><b>Advantages:</b> Ability to undertake strategic projects, provision of essential services and contribution to national development.</p> <p><b>Challenges:</b> Political interference, bureaucratic delays, weak incentives in some situations and financial inefficiency where governance is poor.</p> ` } ], compare:"Sole proprietorship normally gives the owner the greatest direct control but may have the narrowest resource base. Partnership combines resources and skills but requires trust and agreement. Companies provide a more formal structure and may mobilise greater capital. State-owned enterprises are established or controlled by government and may combine commercial and public objectives.", cases:[ { title:"Case Study: Akosua's Fashion Business", text:"Akosua has GH¢40,000 and wants to start a small fashion business. She wants to make decisions quickly and remain personally involved with customers. However, she hopes to expand into three regions within five years. Her brother has offered to contribute capital and marketing expertise, but they have different ideas about how profits should be shared.", questions:[ "Which form of business would you initially recommend for Akosua? Give reasons.", "Would your recommendation change if her brother became a permanent business partner?", "What factors should they consider before choosing a partnership?", "If the business later requires substantial external capital, which form might become more attractive and why?" ] } ], essays:[ "Explain five features of a sole proprietorship.", "Describe the process involved in establishing a partnership.", "Discuss six advantages and four limitations of a company.", "Distinguish between a sole proprietorship and a partnership.", "Explain five reasons why an entrepreneur may choose a sole proprietorship.", "A young entrepreneur wants to expand a small business into a national company. Advise the entrepreneur on an appropriate form of business and justify your answer." ] }, { id:"management", name:"Functions of Management", level:"SHS1", icon:"🧭", meaning:"Management involves coordinating people and other resources to achieve organisational objectives efficiently and effectively.", objective:"Explain the major functions of management and apply them to practical business situations.", intro:["Management is not simply giving instructions. Managers plan what should be achieved, organise resources, direct people and control performance so that objectives can be achieved."], sections:[ {title:"Planning",html:"<p>Planning involves deciding in advance what should be done, how, when, where and by whom. It reduces uncertainty and gives direction.</p><p><b>Importance:</b> provides direction, coordinates activities, supports resource allocation and creates standards for control.</p>"}, {title:"Organising",html:"<p>Organising involves arranging tasks, people, authority and resources so that plans can be implemented efficiently.</p><p><b>Importance:</b> prevents duplication, clarifies responsibility and improves coordination.</p>"}, {title:"Staffing",html:"<p>Staffing involves obtaining and developing the people needed by an organisation. It includes manpower planning, recruitment, selection, placement, training and development.</p>"}, {title:"Directing",html:"<p>Directing involves guiding, supervising, communicating with and motivating employees towards organisational goals.</p>"}, {title:"Controlling",html:"<p>Controlling involves setting standards, measuring actual performance, comparing results with standards and taking corrective action where necessary.</p>"} ], compare:"Planning determines where the organisation wants to go; organising arranges resources; staffing provides people; directing activates people; controlling checks whether performance is on course.", cases:[ {title:"Case: Falling Sales",text:"A retail company has experienced falling sales for four months. The manager blames employees, but there are no clear sales targets, staff roles overlap and customer complaints are not reviewed regularly.",questions:["Identify three management functions that appear weak.","Explain how each function could be improved.","Which function should be addressed first and why?"]} ], essays:[ "Explain five importance of planning to a business.", "Discuss five functions of management.", "Explain how organising contributes to business efficiency.", "Describe the relationship between planning and controlling.", "A business is experiencing poor employee performance. Explain how management functions can be used to solve the problem." ] }, { id:"business-development", name:"Business Development", level:"SHS1", icon:"📈", meaning:"Business development involves identifying and creating opportunities for business growth, improved performance, partnerships, markets and customer value.", objective:"Explain how businesses identify opportunities and develop sustainable growth.", intro:["Business development connects market opportunities with organisational capabilities. It may involve new products, new customers, partnerships, distribution channels or expansion."], sections:[ {title:"Opportunity Identification",html:"<p>Businesses identify unmet customer needs, market gaps, changing technology, demographic changes and emerging consumer behaviour.</p>"}, {title:"Growth Strategies",html:"<p>Growth may involve increasing sales in existing markets, entering new markets, developing products, forming partnerships or diversifying activities.</p>"}, {title:"Importance",html:"<p>Business development can increase revenue, improve competitiveness, create employment, strengthen customer relationships and support long-term survival.</p>"} ], compare:"Growth should not be confused with simply becoming larger. Good growth should create value while maintaining financial, operational and strategic sustainability.", cases:[ {title:"Case: Local Juice Producer",text:"A Ghanaian juice producer has strong demand in Kumasi but limited distribution elsewhere. The owner is considering supermarkets, online ordering, school contracts and exports.",questions:["Which opportunity should be investigated first?","What information should management collect before deciding?","Which risks could arise from rapid expansion?"]} ], essays:[ "Explain five importance of business development.", "Discuss five ways a business can identify new opportunities.", "Explain factors a business should consider before expanding.", "Describe five growth strategies available to a business." ] }, { id:"international", name:"International Business", level:"SHS2", icon:"🌍", meaning:"International business refers to commercial activities that cross national borders, including trade, investment, licensing, franchising and international partnerships.", objective:"Explain international market-entry strategies, evaluate their advantages and disadvantages, and recommend suitable strategies in different business situations.", intro:[ "Entering a foreign market is a strategic decision. A business must consider control, cost, speed, risk, local knowledge, intellectual property, competition, regulations, culture and the resources available.", "The strongest answer in an examination is not merely to define an entry strategy. A strong learner explains why the strategy fits the particular business situation." ], sections:[ { title:"1. Exporting", html:` <p><b>Meaning:</b> Exporting involves producing goods or services in one country and selling them to customers in another country.</p> <p><b>How it works:</b> The business produces or sources the product domestically, identifies foreign buyers or distributors, meets export and destination-country requirements, arranges logistics and receives payment under agreed terms.</p> <p><b>Why a business chooses exporting:</b> It can enter a foreign market without immediately establishing a full foreign operation. It is particularly useful when the business wants to test demand before committing substantial capital.</p> <p><b>Importance:</b> expands the customer base, generates foreign revenue, increases production opportunities and can help a business gain international experience.</p> <p><b>Advantages:</b> lower commitment than owning a foreign subsidiary, potentially faster entry and ability to use existing production facilities.</p> <p><b>Disadvantages:</b> transport costs, tariffs, exchange-rate risks, less control over foreign distribution and possible difficulty understanding local customers.</p> <p><b>Best suited when:</b> the company has competitive products, production capacity and wants relatively low commitment.</p> ` }, { title:"2. Licensing", html:` <p><b>Meaning:</b> Licensing is an arrangement in which the owner of intellectual property gives another business in a foreign market permission to use specified intellectual property, such as a trademark, technology, design or production process, under agreed conditions.</p> <p><b>How it works:</b> The licensor and licensee negotiate rights, territory, duration, payment/royalty arrangements, quality standards and other obligations. The licensee then uses the authorised intellectual property according to the agreement.</p> <p><b>Why choose licensing:</b> It can provide access to foreign markets without requiring the intellectual-property owner to establish and finance the entire foreign operation.</p> <p><b>Importance:</b> monetises intellectual property, creates international presence and can leverage the local licensee's knowledge and resources.</p> <p><b>Advantages:</b> relatively low capital requirement, local knowledge through the licensee and potentially rapid expansion.</p> <p><b>Disadvantages:</b> less control, quality-control problems and risk that the licensee may eventually become a competitor or misuse intellectual property if controls are weak.</p> <p><b>Best suited when:</b> the key competitive asset is intellectual property and the company wants lower financial commitment.</p> ` }, { title:"3. Franchising", html:` <p><b>Meaning:</b> Franchising allows a franchisee to operate a business using the franchisor's brand, business model, systems and support under an agreed franchise arrangement.</p> <p><b>Main parties:</b> The <b>franchisor</b> owns the brand/business system. The <b>franchisee</b> invests in and operates the local outlet according to agreed standards.</p> <p><b>Franchise agreement:</b> It normally specifies territory, duration, fees, royalties, operating standards, training, support, intellectual-property use and obligations of both parties.</p> <p><b>Why choose franchising:</b> It can combine the strength of an established brand with the local entrepreneur's capital, market knowledge and management effort.</p> <p><b>Importance:</b> supports rapid expansion, creates local entrepreneurship, spreads a proven business model and may reduce the franchisor's direct capital burden.</p> <p><b>Advantages:</b> faster expansion, local knowledge, shared investment and established brand recognition.</p> <p><b>Disadvantages:</b> difficult quality control, possible conflicts with franchisees and reputational damage if a franchisee performs poorly.</p> <p><b>Best suited when:</b> the business has a repeatable business model, strong brand and systems that can be transferred to another market.</p> ` }, { title:"4. Joint Venture", html:` <p><b>Meaning:</b> A joint venture occurs when two or more parties collaborate in a business undertaking and contribute resources while sharing agreed risks, returns and responsibilities.</p> <p><b>How it works:</b> Partners agree on contributions, ownership/control arrangements, objectives, decision-making, profit sharing, intellectual property, dispute resolution and exit arrangements.</p> <p><b>Why choose it:</b> A foreign company may lack local knowledge, distribution networks, relationships or understanding of regulations. A local partner may possess these resources.</p> <p><b>Importance:</b> combines complementary resources and can reduce the burden of entering an unfamiliar market.</p> <p><b>Advantages:</b> shared resources, local knowledge, shared risks and access to established networks.</p> <p><b>Disadvantages:</b> conflicts over control, profit sharing, strategy and technology; differences in organisational culture can also create problems.</p> <p><b>Best suited when:</b> the foreign business needs a strong local partner and both parties have complementary capabilities.</p> ` }, { title:"5. Wholly Owned Subsidiary", html:` <p><b>Meaning:</b> A wholly owned subsidiary is a foreign business operation fully owned by its parent company.</p> <p><b>How it may be established:</b> The parent may establish a new foreign operation or acquire an existing business, subject to applicable laws and approvals.</p> <p><b>Why choose it:</b> It provides a high level of control over operations, brand, technology, quality, staffing and strategic decisions.</p> <p><b>Importance:</b> allows the parent company to protect important capabilities and develop a long-term presence in the foreign market.</p> <p><b>Advantages:</b> high control, greater protection of proprietary knowledge and direct access to foreign operations.</p> <p><b>Disadvantages:</b> high capital requirement, high exposure to foreign-market risk, regulatory complexity and potentially slower learning without a local partner.</p> <p><b>Best suited when:</b> the company has substantial resources, requires high control and expects the market to justify long-term investment.</p> ` }, { title:"6. Choosing the Right Strategy", html:` <p>A business should not choose a market-entry strategy simply because one method is described as “best”. The correct strategy depends on circumstances.</p> <ul> <li><b>Need for control:</b> high control may favour a wholly owned subsidiary.</li> <li><b>Limited capital:</b> exporting, licensing or franchising may require less direct investment.</li> <li><b>Need for local knowledge:</b> a joint venture or franchise may provide stronger local insight.</li> <li><b>Importance of intellectual property:</b> licensing may monetise IP while contractual controls protect it.</li> <li><b>Speed:</b> franchising or licensing can facilitate expansion more quickly than building a completely new operation.</li> <li><b>Risk tolerance:</b> firms with low tolerance for financial exposure may choose lower-commitment approaches.</li> <li><b>Nature of product:</b> physical goods may be exported, while service/business models may be suitable for franchising.</li> </ul> ` } ], compare:"Exporting generally requires less foreign investment than a wholly owned subsidiary. Licensing focuses on granting intellectual-property rights, while franchising transfers a broader business system and brand. Joint ventures share resources and control according to agreement. A wholly owned subsidiary gives the parent company the greatest direct control but normally requires greater commitment and exposes the parent to greater market risk.", cases:[ { title:"Case Study 1: Ghanaian Food Manufacturer", text:"A Ghanaian food-processing company has developed a successful snack brand. It has limited experience outside Ghana but receives enquiries from retailers in Côte d’Ivoire and Nigeria. The company has enough production capacity to supply foreign customers but does not have large funds to build factories abroad. A Nigerian distributor has offered to sell the products through its existing network. At the same time, another company has offered to pay for the right to manufacture the snack using the Ghanaian company's formula and brand.", questions:[ "Which market-entry strategy would you recommend initially?", "Compare exporting with licensing in this situation.", "What factors should management investigate before accepting the licensing offer?", "If the company later becomes financially strong and wants maximum control, which strategy could it consider?", "Defend your final recommendation as if you were presenting to the board." ] }, { title:"Case Study 2: Ghanaian Restaurant Brand", text:"A Ghanaian restaurant has built a strong reputation in Accra. Customers frequently ask whether the brand can open in other African countries. The owner wants rapid expansion but does not have enough money to personally finance ten foreign outlets. A local entrepreneur in Kenya has business experience, capital and knowledge of local customers. However, the owner is worried that poor service at a foreign outlet could damage the Ghanaian brand.", questions:[ "Which entry strategy is most appropriate?", "Why might franchising be more suitable than a wholly owned subsidiary?", "What controls should the Ghanaian company put in place?", "What could cause the strategy to fail?", "Would you recommend the same strategy if the owner had unlimited capital? Explain." ] }, { title:"Case Study 3: Technology Company", text:"A Ghanaian technology company has developed a specialised software system for financial institutions. A foreign bank wants to use the technology. Another foreign company wants to become a local partner and jointly establish a technology operation. The Ghanaian company has strong technical knowledge but limited knowledge of the foreign country's regulations and customer behaviour.", questions:[ "Compare licensing and joint venturing for this company.", "Which strategy would you recommend and why?", "What risks are associated with sharing technology with a foreign partner?", "How could the company protect its intellectual property?", "Under what circumstances would a wholly owned subsidiary become preferable?" ] } ], essays:[ "Explain exporting as an approach to international business and discuss five advantages and five limitations.", "Explain licensing and distinguish it from franchising.", "Discuss six advantages and four disadvantages of franchising as an international market-entry strategy.", "Explain how a joint venture is formed and discuss the factors that may determine its success.", "Explain six advantages and four disadvantages of a wholly owned subsidiary.", "A Ghanaian company wants to enter a foreign market but has limited capital and little knowledge of the market. Recommend an entry strategy and justify your answer.", "Compare franchising, licensing and joint venturing.", "Explain five factors a business should consider when selecting an international market-entry strategy." ] }, { id:"ebusiness", name:"E-Business", level:"SHS1", icon:"💻", meaning:"E-business involves using digital technologies and electronic networks to conduct, support or improve business activities.", objective:"Explain how digital technologies support modern business operations.", intro:["E-business can affect marketing, sales, customer service, purchasing, payments, communication and internal operations."], sections:[ {title:"Forms of E-Business",html:"<p>Examples include online retailing, electronic procurement, digital payments, online customer support and business-to-business electronic transactions.</p>"}, {title:"Importance",html:"<p>It can expand market reach, operate beyond normal physical opening hours, improve information flow and reduce some transaction costs.</p>"}, {title:"Challenges",html:"<p>Cybersecurity, privacy, internet access, digital skills, payment risks and customer trust can affect e-business performance.</p>"} ], cases:[ {title:"Case: Online Clothing Store",text:"A clothing business receives many social-media enquiries but loses customers because orders are recorded manually and deliveries are often delayed.",questions:["Identify three e-business problems.","Recommend digital solutions.","What risks must the owner manage?"]} ], essays:[ "Explain five importance of e-business.", "Discuss five challenges of e-business.", "Explain how e-business can improve customer service.", "Describe five digital activities through which a business can serve customers." ] }, { id:"hrm", name:"Human Resource Management", level:"SHS3", icon:"👥", meaning:"Human Resource Management is the systematic process of acquiring, developing, motivating, maintaining and managing people so that organisational and employee objectives can be achieved.", objective:"Explain HRM functions, recruitment, selection, performance appraisal, training, motivation, employee relations and other people-management activities, and apply them to workplace cases.", intro:[ "Employees are a major organisational resource because they use knowledge, skills, judgement and effort to transform other resources into useful products and services.", "HRM therefore goes beyond hiring. It covers workforce planning, recruitment, selection, placement, induction, training, performance management, compensation, employee relations, health and safety, discipline, career development and separation." ], sections:[ { title:"1. Human Resource Planning", html:` <p>Human resource planning involves determining the number and types of employees an organisation needs now and in the future.</p> <p><b>Importance:</b> prevents labour shortages and surpluses, supports expansion, improves workforce quality and helps control labour costs.</p> ` }, { title:"2. Recruitment", html:` <p><b>Meaning:</b> Recruitment is the process of attracting suitable candidates to apply for identified job vacancies.</p> <p><b>Purpose:</b> to create a pool of potentially suitable applicants from which the organisation can select.</p> <p><b>Important principle:</b> recruitment comes before selection. Recruitment attracts candidates; selection evaluates candidates and chooses the most suitable person.</p> ` }, { title:"3. Steps in Recruitment", html:` <ol> <li><b>Identify the vacancy:</b> determine why the position exists and whether it needs to be filled.</li> <li><b>Conduct job analysis:</b> collect information about duties, responsibilities, working conditions and requirements.</li> <li><b>Prepare job description:</b> state the duties, responsibilities, reporting relationships and other important features of the job.</li> <li><b>Prepare job specification:</b> identify the qualifications, skills, knowledge, experience and personal qualities required.</li> <li><b>Choose recruitment source/channel:</b> decide whether to recruit internally, externally or through a combination.</li> <li><b>Advertise/source candidates:</b> communicate the vacancy through suitable channels.</li> <li><b>Receive applications:</b> collect CVs, application forms and supporting documents.</li> <li><b>Screen applications:</b> compare applicants with the basic requirements.</li> <li><b>Shortlist:</b> identify candidates who best meet the requirements for further assessment.</li> </ol> ` }, { title:"4. Channels / Sources of Recruitment", html:` <p><b>Internal recruitment:</b> filling a vacancy using existing employees, such as promotion, transfer or internal vacancy announcements.</p> <p><b>Advantages:</b> lower recruitment cost, employees already understand the organisation and it can motivate staff by showing career opportunities.</p> <p><b>Disadvantages:</b> smaller candidate pool and risk of limiting new ideas.</p> <p><b>External recruitment:</b> attracting people from outside the organisation.</p> <p><b>Channels include:</b> online job platforms, social media, company websites, professional networks, recruitment agencies, educational institutions, employee referrals, newspapers and career fairs.</p> <p><b>Why channel choice matters:</b> the channel should reach the type of candidate required. A specialist position may require a professional network, while a large entry-level recruitment exercise may use online platforms or educational institutions.</p> ` }, { title:"5. Selection", html:` <p>Selection is the process of assessing applicants and choosing the candidate who best meets the requirements of the job and organisation.</p> <p><b>Common stages:</b> application screening, tests where appropriate, interviews, reference checks, background verification where appropriate, final decision, job offer and placement.</p> <p><b>Good selection should be:</b> job-related, consistent, fair, evidence-based and compliant with applicable employment requirements.</p> ` }, { title:"6. Induction and Onboarding", html:` <p>Induction introduces a new employee to the organisation, job, colleagues, policies, procedures, expectations and working environment.</p> <p>Effective induction can reduce anxiety, clarify expectations, improve adjustment and help employees become productive more quickly.</p> ` }, { title:"7. Training and Development", html:` <p><b>Training</b> develops knowledge, skills and attitudes needed for current job performance. <b>Development</b> is broader and prepares employees for future responsibilities and career growth.</p> <p>Methods may include coaching, mentoring, workshops, job rotation, demonstrations, apprenticeships and online learning.</p> ` }, { title:"8. Performance Appraisal", html:` <p><b>Meaning:</b> Performance appraisal is a systematic process of assessing an employee's performance against agreed standards or expectations and providing feedback.</p> <p><b>Importance:</b></p> <ul> <li>Identifies strengths and weaknesses.</li> <li>Helps identify training and development needs.</li> <li>Provides feedback.</li> <li>Supports promotion and career decisions.</li> <li>Can improve motivation when conducted fairly.</li> <li>Helps managers identify performance problems early.</li> <li>Provides information for workforce decisions.</li> </ul> ` }, { title:"9. Steps in Performance Appraisal", html:` <ol> <li><b>Set performance standards:</b> establish clear, realistic and measurable expectations.</li> <li><b>Communicate standards:</b> employees must understand what is expected.</li> <li><b>Measure actual performance:</b> collect relevant evidence such as output, quality, customer feedback or agreed indicators.</li> <li><b>Compare performance with standards:</b> identify gaps and strengths.</li> <li><b>Discuss results:</b> provide constructive feedback and allow the employee to respond.</li> <li><b>Agree corrective/development action:</b> training, coaching, resources, revised targets or other appropriate action.</li> <li><b>Follow up:</b> review progress after an agreed period.</li> </ol> ` }, { title:"10. Methods of Performance Appraisal", html:` <p>Methods can include rating scales, checklists, management by objectives, self-assessment, peer feedback, supervisor assessment and 360-degree feedback.</p> <p><b>360-degree feedback:</b> performance information is collected from several relevant perspectives, which may include supervisors, peers, subordinates and sometimes customers.</p> ` }, { title:"11. Problems/Biases in Performance Appraisal", html:` <ul> <li><b>Halo effect:</b> one strong characteristic influences the overall judgement.</li> <li><b>Recency effect:</b> recent events receive too much attention.</li> <li><b>Leniency:</b> a manager rates employees unusually highly.</li> <li><b>Severity:</b> a manager rates employees unusually harshly.</li> <li><b>Personal bias:</b> irrelevant personal opinions influence assessment.</li> <li><b>Poor standards:</b> vague or unrealistic standards make assessment unreliable.</li> </ul> ` }, { title:"12. Compensation and Benefits", html:` <p>Compensation includes financial and non-financial rewards provided to employees in return for their work. It can include wages, salaries, allowances, bonuses, benefits, recognition and other rewards.</p> <p>A fair reward system can help attract, retain and motivate employees, although money alone does not guarantee high performance.</p> ` }, { title:"13. Employee Relations", html:` <p>Employee relations concern the relationship between management and employees. Effective communication, consultation, fair treatment, grievance procedures and constructive conflict management can support cooperation.</p> ` }, { title:"14. Discipline and Grievance Handling", html:` <p>Discipline involves maintaining acceptable standards of behaviour and performance. A grievance is a formal complaint by an employee about a workplace matter.</p> <p>Good procedures should be clear, consistent, fair and properly documented.</p> ` }, { title:"15. Separation", html:` <p>Employees may leave through resignation, retirement, redundancy, dismissal, termination or other lawful forms of separation. Organisations should manage separation fairly and according to applicable employment requirements.</p> ` } ], compare:"Recruitment attracts applicants; selection chooses among applicants; induction helps the selected employee adjust; training develops skills; performance appraisal evaluates performance and provides feedback; compensation rewards work; employee relations manage workplace relationships.", cases:[ { title:"Case Study 1: Rapid Recruitment", text:"Adom Retail Ltd is expanding from three branches to eight branches. The HR officer advertises vacancies only through one social-media page and receives 700 applications. Because management is under pressure, the HR officer selects people based mainly on how quickly they respond. Several new employees lack the required skills, customer complaints increase and staff turnover becomes high.", questions:[ "Identify four weaknesses in Adom Retail's recruitment process.", "Explain the importance of job analysis before advertising.", "Recommend three recruitment channels the company could use.", "Distinguish between recruitment and selection in this case.", "Design a better recruitment process for the company." ] }, { title:"Case Study 2: Unfair Performance Appraisal", text:"KenteTech Services evaluates employees every December. A supervisor gives one employee a low rating because of an argument that occurred two weeks before the appraisal. The employee had exceeded the annual sales target and had strong customer feedback. The supervisor did not review records from earlier months.", questions:[ "Identify the appraisal problem in the case.", "Explain the recency effect.", "Why should performance standards be communicated before appraisal?", "Recommend four ways the company can make appraisal more reliable.", "Should the employee's appraisal be cancelled or reviewed? Defend your answer." ] }, { title:"Case Study 3: Recruitment vs Selection", text:"A manufacturing company needs a production supervisor. It has advertised the vacancy, received applications and shortlisted eight candidates. The management team is debating whether interviewing is still necessary because all eight candidates have impressive qualifications.", questions:[ "At which stage of the recruitment/selection process is the company?", "Why should qualifications alone not determine the final decision?", "Suggest four selection methods that could be used.", "Explain why job specification is important in this situation.", "Recommend the best final selection approach and justify it." ] } ], essays:[ "Define recruitment and explain six steps involved in the recruitment process.", "Explain five internal and five external sources of recruitment.", "Distinguish between recruitment and selection.", "Explain the importance of job analysis, job description and job specification.", "Define performance appraisal and explain seven reasons why it is important.", "Describe the steps involved in conducting an effective performance appraisal.", "Explain five methods of performance appraisal.", "Discuss five problems that may make performance appraisal unreliable.", "Explain six importance of training and development.", "Discuss five factors that can influence employee motivation.", "Explain five functions of Human Resource Management.", "A company has high employee turnover. Analyse the possible HR causes and recommend solutions." ] }, { id:"marketing", name:"Marketing", level:"SHS3", icon:"📣", meaning:"Marketing involves identifying customer needs, creating value and communicating, delivering and exchanging offerings to satisfy customers and organisational objectives.", objective:"Explain marketing concepts and apply them to business decisions.", intro:["Marketing begins with understanding customers. Selling is one part of marketing; marketing also involves research, product decisions, pricing, promotion, distribution and relationship management."], sections:[ {title:"Marketing Mix",html:"<p>The traditional marketing mix is commonly discussed as product, price, place and promotion. Service marketing may extend this to people, process and physical evidence.</p>"}, {title:"Importance",html:"<p>Marketing helps businesses understand customers, create demand, communicate value, build brands and compete effectively.</p>"}, {title:"Market Research",html:"<p>Market research provides information about customers, competitors, trends and market conditions to improve decision-making.</p>"} ], cases:[ {title:"Case: New Product Launch",text:"A Ghanaian beverage company wants to launch a low-sugar drink for young consumers but has not researched preferred flavours or prices.",questions:["What research should the company conduct?","How should it use the marketing mix?","What risks arise from launching without research?"]} ], essays:[ "Explain five importance of marketing.", "Discuss the elements of the marketing mix.", "Explain five importance of market research.", "Describe five methods of promoting a product." ] }, { id:"finance", name:"Finance", level:"SHS3", icon:"💰", meaning:"Business finance concerns obtaining, allocating and managing money required to establish and operate a business.", objective:"Explain business finance decisions and apply financial reasoning to cases.", intro:["Businesses need finance for start-up, working capital, expansion, assets and unexpected needs. The source chosen affects cost, control, risk and repayment obligations."], sections:[ {title:"Sources of Finance",html:"<p>Sources may include owner's capital, retained profit, bank finance, trade credit, leasing and other appropriate forms of finance.</p>"}, {title:"Importance of Financial Planning",html:"<p>Financial planning helps estimate funding needs, manage cash, anticipate shortages and allocate resources.</p>"} ], cases:[ {title:"Case: Expansion Finance",text:"A business wants to buy new equipment but has limited cash. The owner is considering a bank loan, using retained profits or bringing in a new investor.",questions:["Compare the three options.","Which option would you recommend?","What factors should influence the decision?"]} ], essays:[ "Explain five importance of finance to a business.", "Discuss five sources of business finance.", "Explain factors considered when choosing a source of finance.", "Distinguish between short-term and long-term finance." ] }, { id:"production", name:"Production and Operations", level:"SHS3", icon:"🏭", meaning:"Production and operations management involves transforming inputs into goods or services efficiently and effectively.", objective:"Explain production processes, productivity, quality and operational decisions.", intro:["Operations connect resources such as materials, labour, equipment and information to outputs that customers value."], sections:[ {title:"Production Systems",html:"<p>Production may be job, batch, mass/flow or continuous depending on product characteristics and demand.</p>"}, {title:"Quality Management",html:"<p>Quality management aims to ensure that products or services consistently meet agreed standards and customer expectations.</p>"}, {title:"Importance",html:"<p>Efficient operations can reduce waste, control cost, improve quality and strengthen competitiveness.</p>"} ], cases:[ {title:"Case: Production Waste",text:"A small manufacturing company experiences high material waste and customer complaints about inconsistent product quality.",questions:["Identify likely operational causes.","Recommend quality improvements.","How could staff training affect productivity?"]} ], essays:[ "Explain five importance of production management.", "Discuss four types of production systems.", "Explain five ways a business can improve productivity.", "Discuss five importance of quality control." ] }, { id:"law-contract", name:"Law of Contract", level:"SHS2", icon:"⚖️", meaning:"A contract is a legally enforceable agreement between parties, subject to the requirements of applicable law.", objective:"Explain essential elements of a valid contract and apply contract principles to cases.", intro:["Business transactions rely heavily on agreements. Learners should understand not only definitions but how contract principles apply when parties disagree."], sections:[ {title:"Essentials of a Valid Contract",html:"<p>Important elements include offer, acceptance, consideration, intention to create legal relations, capacity, legality and certainty, subject to the applicable legal context.</p>"}, {title:"Application",html:"<p>When analysing a contract problem, identify the facts, identify the relevant element, explain the rule and apply the rule to the facts before reaching a conclusion.</p>"} ], cases:[ {title:"Case: The Unclear Deal",text:"Kojo offers to sell a machine to Yaw for GH¢50,000. Yaw says he will think about it. Kojo later claims that a contract exists because Yaw inspected the machine.",questions:["Was acceptance clearly communicated?","Which elements of contract should be examined?","Apply the principles to the facts and reach a reasoned conclusion."]} ], essays:[ "Explain six essential elements of a valid contract.", "Distinguish between an offer and an invitation to treat.", "Explain acceptance and state conditions for effective acceptance.", "Discuss consideration as an element of a contract.", "Apply the essentials of a valid contract to a business case." ] }, { id:"risk", name:"Business Risk and Insurance", level:"SHS2", icon:"🛡️", meaning:"Business risk is the possibility that events may cause loss, reduced profit or failure to achieve objectives. Insurance is a mechanism for transferring specified risks to an insurer in exchange for a premium, subject to policy terms.", objective:"Identify business risks, explain insurance and apply risk-management principles.", intro:["Risk cannot always be eliminated. Managers identify risks, assess likelihood and impact, select controls and decide which risks should be transferred through insurance."], sections:[ {title:"Types of Risk",html:"<p>Risks may arise from fire, theft, accidents, natural events, market changes, operational failure, credit problems, technology and other sources.</p>"}, {title:"Risk Management",html:"<p>Steps may include identifying risks, analysing them, evaluating priorities, selecting controls, implementing measures and monitoring results.</p>"}, {title:"Importance of Insurance",html:"<p>Insurance can protect against specified financial losses, support business continuity and provide greater confidence when undertaking legitimate business activities.</p>"} ], cases:[ {title:"Case: Warehouse Fire",text:"A distributor stores valuable stock in a warehouse. Management has insurance but has not maintained fire equipment and stores electrical cables poorly.",questions:["Identify the risks.","Explain why insurance alone is insufficient.","Recommend risk-control measures.","How might poor risk management affect an insurance claim?"]} ], essays:[ "Explain five types of business risk.", "Explain six importance of insurance to business.", "Describe the risk-management process.", "Distinguish between risk prevention and risk transfer.", "Explain factors a business should consider when selecting insurance." ] } ]; /* ============================================================ EXAM QUESTION BANK ============================================================ */ const objectivePool = [ ["Which of the following best describes recruitment?","Attracting suitable applicants for a vacancy","Selecting the final employee","Training existing workers","Appraising employees",0], ["Which strategy gives a parent company full ownership of a foreign subsidiary?","Licensing","Franchising","Wholly owned subsidiary","Exporting",2], ["A franchisee normally receives the right to use a franchisor's:","Personal bank account","Brand and business system","Private home","Tax number",1], ["A joint venture is mainly characterised by:","One owner only","Shared resources and agreed participation","No risk","No contractual arrangement",1], ["Which stage normally follows shortlisting?","Performance appraisal","Selection assessment","Retirement","Production",1], ["A job description mainly explains:","The duties and responsibilities of a job","The employee's personal hobbies","The company's annual profit","The candidate's family history",0], ["A job specification mainly identifies:","Job requirements and qualities needed","Customer complaints","Product prices","Company debts",0], ["Which is an internal recruitment source?","Promotion","Newspaper advertisement","External agency","Career fair",0], ["Which is an external recruitment source?","Transfer","Promotion","Recruitment agency","Internal notice",2], ["Performance appraisal is mainly concerned with:","Assessing employee performance against expectations","Buying machinery","Setting product prices","Choosing suppliers",0], ["The recency effect occurs when an appraiser:","Focuses too much on recent events","Rates everyone equally","Uses several sources of evidence","Sets clear standards",0], ["The halo effect occurs when:","One characteristic influences the overall judgement","All employees receive training","Targets are increased","Recruitment is external",0], ["Which entry strategy generally requires the highest direct control?","Licensing","Exporting","Wholly owned subsidiary","Simple distribution",2], ["Exporting means:","Selling goods/services across borders","Buying another company","Hiring foreign employees only","Giving away a trademark",0], ["Licensing normally involves:","Granting specified intellectual-property rights","Opening a fully owned factory","Hiring all foreign workers","Buying a competitor",0], ["Which factor strongly supports a joint venture decision?","Need for local partner knowledge","Desire to avoid all cooperation","No available partner","No market research",0], ["A sole proprietorship normally has:","One owner","Twenty shareholders","Government ownership","A board of directors only",0], ["A partnership is based on:","An arrangement between partners","Government ownership","Only one owner","No contribution",0], ["A company can have:","A separate legal identity subject to law","No legal obligations","No management","No records",0], ["One major advantage of a company is:","Potential access to larger capital","No regulations","No risk","No accounting",0], ["Planning involves:","Deciding in advance what should be done","Checking only past performance","Hiring only","Selling only",0], ["Controlling involves:","Comparing actual performance with standards and correcting deviations","Advertising only","Recruiting only","Exporting only",0], ["Marketing begins with:","Understanding customer needs and creating value","Ignoring customers","Producing without research","Avoiding competition",0], ["Market research helps a business:","Make informed decisions","Eliminate every risk","Guarantee profit","Avoid all competition",0], ["Business risk refers to:","Possibility of events affecting objectives or results","Guaranteed profit","A fixed salary","A business name",0], ["Insurance is primarily used to:","Transfer specified financial risks subject to policy terms","Guarantee profit","Remove every business risk","Avoid management",0], ["Which is a source of business finance?","Retained profit","Customer complaint","Job description","Franchise manual",0], ["Quality management aims to:","Meet agreed quality standards consistently","Increase defects","Ignore customers","Reduce all training",0], ["E-business can help businesses:","Reach customers through digital channels","Eliminate every cyber risk","Avoid all costs","Stop communication",0], ["A state-owned enterprise is generally:","Owned or controlled by government","Owned by one student","Always a partnership","Never commercial",0] ]; const essaySets = [ [ "Explain six essentials of a valid contract and apply them to a business situation.", "Discuss six ways a business can identify, assess and manage risks.", "Explain five reasons a Ghanaian business may choose exporting when entering a foreign market.", "Explain six functions of Human Resource Management.", "Distinguish between recruitment and selection and explain why both are important.", "Define performance appraisal and discuss six reasons for conducting it." ], [ "Explain the difference between an offer and an invitation to treat, using business examples.", "Explain five types of business risk and recommend suitable control measures.", "Explain licensing and discuss five reasons a business may choose it.", "Describe the major stages in the recruitment process.", "Explain five internal and five external recruitment channels.", "Discuss five problems that can make performance appraisal unfair." ], [ "Explain six requirements that should be considered when determining whether a contract is valid.", "Discuss the importance of insurance to a business.", "Explain franchising and analyse five reasons for choosing franchising over a wholly owned subsidiary.", "Explain job analysis, job description and job specification.", "Discuss six importance of training and development.", "Describe the steps involved in effective performance appraisal." ], [ "Explain acceptance as an element of a valid contract.", "Distinguish between risk prevention and risk transfer.", "Explain a joint venture and discuss four possible benefits and four challenges.", "Explain five methods through which organisations can recruit employees.", "Explain five methods of employee selection.", "Discuss the importance of feedback in performance appraisal." ], [ "Discuss consideration as an element of a valid contract.", "Explain the importance of identifying business risks before expansion.", "Explain a wholly owned subsidiary and discuss its advantages and disadvantages.", "Explain the importance of induction to a newly recruited employee.", "Discuss six factors that can influence employee motivation.", "Explain five common appraisal biases and how they can be reduced." ], [ "Using a practical example, explain how capacity to contract may affect a business agreement.", "Explain five factors that determine the choice of insurance cover.", "Compare exporting, licensing and franchising.", "Explain how an organisation should prepare a job description and job specification.", "Discuss five benefits of employee development.", "Explain the process of measuring employee performance." ], [ "Explain the importance of intention to create legal relations in business agreements.", "Explain five methods of reducing operational risk.", "Compare joint ventures and wholly owned subsidiaries.", "Discuss internal and external recruitment and state situations in which each is appropriate.", "Explain the importance of fair selection procedures.", "Discuss how appraisal results can be used to improve employee performance." ], [ "Explain five circumstances that may make a business agreement legally problematic.", "Discuss the role of insurance in business continuity.", "Explain why a business with limited capital may choose exporting or licensing.", "Discuss six functions of an HR department.", "Explain the importance of interviews and selection tests.", "Discuss the relationship between performance appraisal and training." ], [ "Explain the importance of certainty in a business agreement.", "Explain how a business can manage risks without relying only on insurance.", "Recommend a suitable entry strategy for a Ghanaian company entering an unfamiliar African market and justify your decision.", "Explain six steps in recruitment.", "Discuss five recruitment channels and their suitability.", "Explain how performance appraisal can support promotion and career development." ], [ "Explain six elements that should be considered when analysing a contract case.", "Analyse the difference between insurable and non-insurable business risks.", "Evaluate the advantages and disadvantages of franchising for a growing business.", "Explain how poor recruitment can affect organisational performance.", "Discuss five methods of developing employees.", "Analyse a situation in which an employee believes an appraisal is unfair and recommend corrective action." ] ]; /* ============================================================ RENDERING ============================================================ */ function render(){ try{ if(APP.role === "teacher"){ $$(".role-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.role==="teacher")); }else{ $$(".role-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.role==="student")); } switch(APP.page){ case "topics": renderTopics(); break; case "practice": renderPractice(); break; case "scanner": renderScanner(); break; case "assistant": renderAssistant(); break; case "teacher": renderTeacher(); break; case "about": renderAbout(); break; case "settings": renderSettings(); break; default: renderHome(); } }catch(error){ console.error(error); $("#main").innerHTML = ` <div class="empty"> <h2>Something went wrong</h2> <p>The app protected itself from crashing. Please reload the page.</p> <button class="btn btn-primary" data-action="reload">Reload</button> </div>`; } } function renderHome(){ const pct = progressPercent(); $("#main").innerHTML = ` <section class="hero"> <div class="hero-card"> <div class="eyebrow">Ghana SHS Business Management</div> <h1>Learn the idea. Understand the reason. Apply it.</h1> <p> BM Learn AI is designed to move students beyond memorising definitions. Learn concepts deeply, analyse business situations and practise examination thinking. </p> <div class="actions"> <button class="btn btn-primary" data-page="topics">📚 Start Learning</button> <button class="btn btn-secondary" data-page="practice">📝 Practice Test</button> <button class="btn btn-secondary" data-page="scanner">📸 Scan a Question</button> </div> </div> </section> <section class="stats"> <div class="stat"><strong>${topics.length}</strong><span>Learning Topics</span></div> <div class="stat"><strong>${APP.completed.length}</strong><span>Topics Completed</span></div> <div class="stat"><strong>${APP.practiceAttempts}</strong><span>Practice Attempts</span></div> <div class="stat"><strong>${APP.practiceScore}</strong><span>Best Score</span></div> </section> <section class="section"> <div class="section-head"> <div> <h2>Your Learning Progress</h2> <p>${pct}% of the current topic library completed.</p> </div> <b>${pct}%</b> </div> <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div> </section> <section class="section"> <div class="section-head"> <div> <h2>Learn Differently</h2> <p>Choose what you need.</p> </div> </div> <div class="grid"> ${[ ["📚","Deep Notes","Understand definitions, explanations, examples and applications.","topics"], ["🧠","Think & Apply","Analyse realistic business cases instead of memorising answers.","practice"], ["📸","Question Scanner","Upload or photograph a question and use the AI-solving workflow.","scanner"], ["🤖","BM Thinking Assistant","Ask for explanations, comparisons and exam-focused guidance.","assistant"] ].map(x=>` <div class="card topic-card" data-page="${x[3]}"> <div style="font-size:28px">${x[0]}</div> <h3>${x[1]}</h3> <p>${x[2]}</p> </div>`).join("")} </div> </section> ${APP.role==="teacher" ? ` <section class="section"> <div class="card"> <div class="eyebrow">Teacher Mode</div> <h2>👨🏽‍🏫 Teacher Centre</h2> <p>Create varied practice examinations, choose from 10 different Section-B structures and generate matching marking schemes.</p> <button class="btn btn-primary" data-page="teacher">Open Teacher Centre</button> </div> </section>` : ""} `; } function renderTopics(){ const filtered = topics.filter(t=>{ const matchesLevel = APP.topicFilter==="ALL" || t.level===APP.topicFilter; const text = `${t.name} ${t.meaning}`.toLowerCase(); return matchesLevel && text.includes(APP.topicSearch.toLowerCase()); }); $("#main").innerHTML = ` <section class="section"> <div class="section-head"> <div> <div class="eyebrow">Learning Library</div> <h2>Business Management Topics</h2> <p>Detailed notes with cases and trial essays.</p> </div> </div> <div class="search-row"> <div class="search-box"> <input class="input" id="topicSearch" placeholder="Search topics..." value="${escapeHTML(APP.topicSearch)}"> </div> </div> <br> <div class="filters"> ${["ALL","SHS1","SHS2","SHS3"].map(f=>` <button class="filter ${APP.topicFilter===f?"active":""}" data-filter="${f}">${f==="ALL"?"All Levels":f}</button> `).join("")} </div> </section> <section class="section"> <div class="grid"> ${filtered.length ? filtered.map(topicCard).join("") : `<div class="empty">No topic found.</div>`} </div> </section>`; } function topicCard(t){ const done = APP.completed.includes(t.id); return ` <div class="card topic-card" data-topic="${t.id}"> <div class="card-top"> <div style="font-size:28px">${t.icon}</div> <span class="badge">${t.level}</span> </div> <h3>${escapeHTML(t.name)}</h3> <p>${escapeHTML(t.meaning)}</p> <div class="actions"> <button class="btn ${done?"btn-secondary":"btn-primary"}" data-topic="${t.id}"> ${done?"✓ Completed":"Open Lesson"} </button> </div> </div>`; } function renderLesson(topic){ APP.currentTopic = topic; const done = APP.completed.includes(topic.id); const sections = topic.sections.map(s=>` <div class="lesson-section"> <h3>${s.title}</h3> ${s.html} </div>`).join(""); const cases = (topic.cases || []).map(c=>` <div class="case"> <h4>🧠 ${escapeHTML(c.title)}</h4> <p>${escapeHTML(c.text)}</p> <ol> ${c.questions.map(q=>`<li>${escapeHTML(q)}</li>`).join("")} </ol> </div>`).join(""); const essays = (topic.essays || []).map((q,i)=>` <div class="essay-item"> <b>Trial Essay ${i+1}</b> <div>${escapeHTML(q)}</div> </div>`).join(""); openModal(topic.icon+" "+topic.name,` <div class="lesson-section"> <h3>🎯 Learning Objective</h3> <p>${escapeHTML(topic.objective)}</p> </div> <div class="lesson-section"> <h3>📖 Meaning / Definition</h3> <p>${escapeHTML(topic.meaning)}</p> </div> <div class="lesson-section"> <h3>🧠 Introduction & Explanation</h3> ${topic.intro.map(x=>`<p>${escapeHTML(x)}</p>`).join("")} </div> ${sections} <div class="lesson-section"> <h3>⚖️ Important Comparison</h3> <div class="key-box">${escapeHTML(topic.compare || "Compare the concept with related business ideas and explain when each would be appropriate.")}</div> </div> ${cases ? ` <div class="lesson-section"> <h3>🧩 Application & Critical Thinking Cases</h3> <p>Do not rush to the answer. Identify the facts, identify the concept, apply the concept and justify your conclusion.</p> ${cases} </div>`:""} <div class="lesson-section"> <h3>📝 Trial Essay Questions</h3> <p>Try each question before asking BM Learn AI for a model answer.</p> ${essays} </div> <div class="actions"> <button class="btn ${done?"btn-secondary":"btn-primary"}" data-action="complete-topic" data-id="${topic.id}"> ${done?"✓ Completed — Tap to Undo":"✓ Mark Topic Complete"} </button> <button class="btn btn-secondary" data-page="practice">📝 Practice</button> </div> `); } /* ============================================================ PRACTICE ============================================================ */ function renderPractice(){ const qs = shuffle([...objectivePool]).slice(0,10); $("#main").innerHTML = ` <section class="hero"> <div class="hero-card"> <div class="eyebrow">Student Assessment</div> <h1>Practice Test</h1> <p>10 questions • Mixed Business Management topics • Instant score</p> <button class="btn btn-primary" data-action="start-practice">Start Test</button> </div> </section> <section class="section"> <div class="card"> <h3>🧠 How to use practice effectively</h3> <p>Do the questions without looking at your notes. After marking, revisit every question you missed and explain why the correct option is correct.</p> </div> </section>`; } function startPractice(){ const qs = shuffle([...objectivePool]).slice(0,10); openModal("📝 Practice Test",` <form id="practiceForm"> ${qs.map((q,i)=>` <div class="lesson-section"> <h3>Question ${i+1}</h3> <p><b>${escapeHTML(q[0])}</b></p> ${q.slice(1,5).map((opt,j)=>` <label class="option"> <input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${escapeHTML(opt)} </label> `).join("")} </div>`).join("")} <button class="btn btn-primary" type="submit">Submit Test</button> </form> `); $("#practiceForm").addEventListener("submit",e=>{ e.preventDefault(); let score=0; qs.forEach((q,i)=>{ const selected = document.querySelector(`input[name="q${i}"]:checked`); if(selected && Number(selected.value)===q[5]) score++; }); APP.practiceAttempts++; if(score>APP.practiceScore) APP.practiceScore=score; saveState(); $("#modalBody").innerHTML=` <div class="result"> <h2>${score}/10</h2> <p>${score>=8?"Excellent work! 🔥":score>=5?"Good start. Review the questions you missed.":"Use the result as a learning guide. Revisit the relevant topics and try again."}</p> </div> <br> <button class="btn btn-primary" data-action="close-modal">Continue</button> `; toast("Practice completed."); }); } /* ============================================================ SCANNER ============================================================ */ function renderScanner(){ $("#main").innerHTML = ` <section class="hero"> <div class="hero-card"> <div class="eyebrow">Question Analysis</div> <h1>📸 Scan & Think</h1> <p>Take a clear photo of a Business Management question or upload one from your phone.</p> <div class="actions"> <button class="btn btn-primary" data-action="open-scanner">📷 Take / Upload Question</button> <button class="btn btn-secondary" data-action="paste-question">⌨️ Type Question</button> </div> </div> </section> <section class="section"> <div class="card"> <h3>🤖 How the AI solver should respond</h3> <p><b>1.</b> Identify the question.</p> <p><b>2.</b> Identify the Business Management concept being tested.</p> <p><b>3.</b> Explain the reasoning.</p> <p><b>4.</b> Apply it to the facts.</p> <p><b>5.</b> Produce an examination-ready answer.</p> <p><b>6.</b> Point out common mistakes.</p> </div> </section> <section class="section"> <div class="card"> <div class="badge">AI CONNECTION</div> <h3>Secure AI integration</h3> <p>This website is ready for a secure AI backend. Do not place an API key directly inside this GitHub file.</p> </div> </section>`; } function openScanner(){ $("#scanInput").value=""; $("#scanInput").click(); } function handleScan(file){ if(!file) return; if(!file.type.startsWith("image/")){ toast("Please choose an image."); return; } const reader = new FileReader(); reader.onload = e=>{ APP.scanImage = e.target.result; openModal("📸 Question Scanner",` <img src="${APP.scanImage}" class="scan-preview" style="display:block"> <br> <div class="lesson-section"> <h3>Step 1 — Image Ready</h3> <p>Your question image has been loaded.</p> </div> <button class="btn btn-primary" data-action="solve-scan"> 🤖 Solve with AI </button> <p style="color:var(--muted);font-size:12px;margin-top:12px"> A secure AI backend should be connected before this sends the image to an external AI service. Until then, BM Learn AI provides a safe learning workflow instead of pretending that an external AI has analysed the image. </p> `); }; reader.onerror=()=>{ toast("The image could not be read. Try another image."); }; reader.readAsDataURL(file); } function solveScan(){ openModal("🤖 AI Question Sol
