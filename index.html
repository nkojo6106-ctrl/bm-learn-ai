ver",` <div class="lesson-section"> <h3>AI Analysis Workflow</h3> <p>For a real external AI response, the image must be sent through a secure server/backend. Your GitHub website should never contain a private API key.</p> </div> <div class="ai-output">BM Learn AI is ready for the secure AI connection. When connected, the solver will: • Read the photographed question • Identify the topic • Identify command words such as explain, discuss, analyse or evaluate • Break the question into required points • Reason through the case • Give a detailed explanation • Give a Ghana-relevant example where appropriate • Produce an examination-ready answer • Highlight common mistakes • Ask the learner a follow-up thinking question</div> <br> <div class="think"> <strong>🧠 Think before seeing the answer</strong> <p>What Business Management topic do you think this question is testing? What command word is used?</p> </div> `); } function pasteQuestion(){ openModal("⌨️ Type a Question",` <textarea id="typedQuestion" class="textarea" rows="7" placeholder="Type or paste your Business Management question here..."></textarea> <br><br> <button class="btn btn-primary" data-action="analyse-text">🤖 Analyse with BM Thinking Assistant</button> `); } function analyseText(){ const q = $("#typedQuestion")?.value.trim(); if(!q){ toast("Please enter a question."); return; } const lower=q.toLowerCase(); let topic="Business Management"; let guidance="Break the question into the command word, key concept and facts that must be applied."; if(lower.includes("recruit") || lower.includes("selection") || lower.includes("performance appraisal") || lower.includes("human resource")){ topic="Human Resource Management"; guidance="Identify the HR concept, explain it clearly, then apply it to the facts in the question."; }else if(lower.includes("franchise") || lower.includes("licens") || lower.includes("joint venture") || lower.includes("export") || lower.includes("subsidiary")){ topic="International Business"; guidance="Compare the entry strategy with the firm's capital, control, local knowledge, risk and long-term objectives."; }else if(lower.includes("contract") || lower.includes("offer") || lower.includes("acceptance") || lower.includes("consideration")){ topic="Law of Contract"; guidance="Identify the relevant contractual principle, explain the rule and apply it to the facts before concluding."; }else if(lower.includes("insurance") || lower.includes("risk")){ topic="Business Risk and Insurance"; guidance="Identify the risk, assess its likely effect and recommend suitable prevention, reduction or transfer measures."; } openModal("🤖 BM Thinking Analysis",` <div class="lesson-section"> <h3>Topic Detected</h3> <p>${escapeHTML(topic)}</p> </div> <div class="lesson-section"> <h3>Your Question</h3> <p>${escapeHTML(q)}</p> </div> <div class="lesson-section"> <h3>🧠 Thinking Framework</h3> <p>${escapeHTML(guidance)}</p> </div> <div class="think"> <strong>Exam Thinking Rule</strong> <p>Do not only state a point. State the point, explain it, connect it to the question and give an appropriate example or implication.</p> </div> <button class="btn btn-secondary" data-page="topics">Open Topic Library</button> `); } /* ============================================================ ASSISTANT ============================================================ */ function renderAssistant(){ $("#main").innerHTML=` <section class="hero"> <div class="hero-card"> <div class="eyebrow">BM Thinking Assistant</div> <h1>🤖 Ask. Understand. Apply.</h1> <p>Ask Business Management questions and receive structured learning guidance.</p> </div> </section> <section class="section"> <div class="card"> <label>Answer style</label> <select class="select" id="assistantStyle"> <option value="detailed">Detailed explanation</option> <option value="exam">Examination answer</option> <option value="simple">Simple learner explanation</option> <option value="case">Case-study analysis</option> </select> <br><br> <textarea class="textarea" id="assistantQuestion" rows="6" placeholder="Example: Explain why a business may choose franchising instead of a wholly owned subsidiary."></textarea> <br><br> <button class="btn btn-primary" data-action="ask-assistant">🤖 Think Through It</button> </div> </section> <section class="section"> <div class="card"> <h3>💡 Better prompts</h3> <p>“Explain recruitment step by step and give a Ghanaian business example.”</p> <p>“Compare licensing and franchising and tell me when each is appropriate.”</p> <p>“Give me a case study on performance appraisal and make me analyse it before revealing the answer.”</p> </div> </section>`; } function askAssistant(){ const q=$("#assistantQuestion")?.value.trim(); const style=$("#assistantStyle")?.value || "detailed"; if(!q){ toast("Type your question first."); return; } const lower=q.toLowerCase(); let matched=null; for(const t of topics){ const words=t.name.toLowerCase().split(/\s+/); if(words.some(w=>w.length>3 && lower.includes(w))){ matched=t; break; } } let answer=""; if(matched){ answer= `TOPIC: ${matched.name} DEFINITION ${matched.meaning} HOW TO THINK ABOUT IT ${matched.objective} KEY IDEA ${matched.intro.join("\n\n")} EXAM APPROACH Identify the command word. State the relevant concept. Explain each point. Apply it to the business situation. Where appropriate, give a realistic example. LEARNER CHALLENGE Can you explain this topic without looking at your notes? Then create your own business example.`; }else{ answer= `BM LEARN AI THINKING FRAMEWORK I could not confidently match the question to one specific built-in topic. Use this approach: 1. Identify the command word. 2. Identify the Business Management concept. 3. Define the concept. 4. Break the question into parts. 5. Explain each relevant point. 6. Apply the concept to the facts. 7. Give an example where appropriate. 8. Conclude with a justified judgement if the question says analyse, evaluate, assess or recommend. QUESTION: ${q}`; } if(style==="exam"){ answer += ` EXAMINATION STYLE Write direct points. For every major point, explain it and link it to the question. Avoid listing unexplained headings.`; } if(style==="case"){ answer += ` CASE ANALYSIS FACTS → ISSUE → CONCEPT → APPLICATION → CONSEQUENCE → RECOMMENDATION`; } if(style==="simple"){ answer += ` SIMPLE EXPLANATION Think of the topic as a real business decision. Ask: What is happening? Why does it matter? What would a manager do?`; } openModal("🤖 BM Thinking Assistant",` <div class="ai-output">${escapeHTML(answer)}</div> <br> <div class="think"> <strong>Think further</strong> <p>Now create a practical Ghanaian business example and explain how the concept would apply.</p> </div> `); } /* ============================================================ TEACHER CENTRE ============================================================ */ function renderTeacher(){ if(APP.role!=="teacher"){ navigate("home"); return; } $("#main").innerHTML=` <section class="hero"> <div class="hero-card"> <div class="eyebrow">Teacher Centre</div> <h1>👨🏽‍🏫 Build better assessments.</h1> <p>Generate different examination sets instead of giving students the same essay questions repeatedly.</p> <div class="actions"> <button class="btn btn-primary" data-action="generate-exam">📝 Generate Exam</button> <button class="btn btn-secondary" data-action="show-marking">📋 Marking Scheme</button> </div> </div> </section> <section class="section"> <div class="grid"> <div class="card"> <div style="font-size:28px">🔢</div> <h3>10 Section-B Sets</h3> <p>Same structure, different questions.</p> </div> <div class="card"> <div style="font-size:28px">🎯</div> <h3>Application</h3> <p>Cases require learners to apply concepts.</p> </div> <div class="card"> <div style="font-size:28px">📋</div> <h3>Matching Marking</h3> <p>Generate a corresponding marking framework.</p> </div> </div> </section> <section class="section"> <div class="card"> <h3>Exam Structure</h3> <p><b>Section A:</b> 50 objectives × ½ mark = 25 marks.</p> <p><b>Section B:</b> Question 1 compulsory case study = 25 marks.</p> <p><b>Questions 2–7:</b> Answer any 3 questions.</p> <p><b>Coverage:</b> Law of Contract, Business Risk & Insurance, International Business and Human Resource Management.</p> </div> </section>`; } function generateExam(){ APP.examSet = Math.floor(Math.random()*10)+1; const objectives = shuffle([...objectivePool]).slice(0,50); APP.examQuestions = objectives; const essays=essaySets[APP.examSet-1]; const caseStudy = ` Adom Growth Enterprises Ltd is a Ghanaian business that has grown from a small local operation into a medium-sized enterprise. Management plans to enter another African market within the next two years. The company is considering exporting, licensing, franchising, a joint venture and a wholly owned subsidiary. At the same time, the company is experiencing recruitment problems. Several employees were hired quickly because the company needed staff. Job descriptions were not properly prepared, recruitment was conducted through only one channel and some employees were appointed without structured interviews. After six months, management noticed high turnover and inconsistent performance. The HR manager introduced a performance appraisal system. However, some supervisors gave employees poor ratings based mainly on recent incidents instead of considering performance throughout the year. Other supervisors gave almost everyone very high ratings. The finance manager has also warned the board about business risks, including fire, theft, exchange-rate changes, transport problems and possible disagreement with international partners. The board has asked management to prepare a strategy that balances growth, control, cost, risk and employee performance. `; let examHTML=` <div class="exam-sheet" id="printArea"> <h1>BM LEARN AI</h1> <h2>Business Management Practice Examination</h2> <p><b>Section B Set ${APP.examSet}</b> • Original practice material</p> <hr> <h2>SECTION A — OBJECTIVE TEST</h2> <p>Answer all questions. Each question carries ½ mark.</p> ${objectives.map((q,i)=>` <p> <b>${i+1}.</b> ${escapeHTML(q[0])}<br> A. ${escapeHTML(q[1])}<br> B. ${escapeHTML(q[2])}<br> C. ${escapeHTML(q[3])}<br> D. ${escapeHTML(q[4])} </p>`).join("")} <hr> <h2>SECTION B — STRUCTURED ESSAY & CASE STUDY</h2> <h3>QUESTION ONE — COMPULSORY [25 MARKS]</h3> <p>${escapeHTML(caseStudy)}</p> <ol> <li>Explain four recruitment weaknesses shown in the case and recommend improvements. [6 marks]</li> <li>Identify three risks facing Adom Growth Enterprises Ltd and explain appropriate risk-management measures. [6 marks]</li> <li>Recommend an international market-entry strategy for the company and justify your recommendation using at least three relevant factors. [7 marks]</li> <li>Explain three HRM measures that could improve employee performance and retention. [6 marks]</li> </ol> <h3>QUESTIONS 2–7</h3> <p><b>Answer any THREE questions.</b></p> ${essays.map((q,i)=>` <p><b>${i+2}.</b> ${escapeHTML(q)}</p> `).join("")} <hr> <p><b>End of Paper</b></p> </div> `; openModal(`📝 Generated Examination — Set ${APP.examSet}`,` ${examHTML} <br> <div class="actions"> <button class="btn btn-primary" data-action="print-exam">🖨️ Print / Save PDF</button> <button class="btn btn-secondary" data-action="show-marking">📋 View Marking Scheme</button> <button class="btn btn-secondary" data-action="generate-exam">🔄 Generate Another Set</button> </div> `); toast(`Exam Set ${APP.examSet} generated.`); } function showMarking(){ const set=APP.examSet; const essays=essaySets[set-1]; const scheme=` <div class="lesson-section"> <h3>Section A</h3> <p>Each correct objective answer carries ½ mark. The answer key is shown below.</p> <p>${APP.examQuestions.length ? APP.examQuestions.map((q,i)=>`${i+1}. ${String.fromCharCode(65+q[5])}`).join(" • ") : "Generate an examination first to create its objective key."}</p> </div> <div class="lesson-section"> <h3>Question 1 — Case Study [25 marks]</h3> <ol> <li><b>Recruitment weaknesses [6]:</b> award marks for relevant weaknesses such as inadequate job analysis, weak recruitment channels, rushed screening, lack of structured interviews and poor job specification, with appropriate explanations.</li> <li><b>Business risks [6]:</b> award marks for identifying relevant risks and explaining suitable prevention, reduction, control or transfer measures.</li> <li><b>Entry strategy [7]:</b> reward a justified recommendation based on capital, control, risk, local knowledge, speed, intellectual property and long-term objectives.</li> <li><b>HR measures [6]:</b> award relevant measures such as improved recruitment, induction, training, fair appraisal, feedback, motivation and employee development.</li> </ol> </div> <div class="lesson-section"> <h3>Questions 2–7 — Set ${set}</h3> ${essays.map((q,i)=>` <div class="essay-item"> <b>Q${i+2}</b> <p>${escapeHTML(q)}</p> <p><b>Marking guidance:</b> Award marks for accurate concepts, relevant explanations, application/examples and logical conclusions where required.</p> </div>`).join("")} </div> <div class="think"> <strong>Teacher note</strong> <p>For application questions, do not award full credit for unexplained lists. Reward learners who connect their answers to the facts of the case.</p> </div> `; openModal(`📋 Marking Scheme — Set ${set}`,scheme); } /* ============================================================ SETTINGS ============================================================ */ function renderSettings(){ $("#main").innerHTML=` <section class="section"> <div class="eyebrow">Personalise BM Learn AI</div> <h2>⚙️ Settings</h2> </section> <section class="section"> <div class="grid"> <div class="card"> <h3>🎓 Student Settings</h3> <p>Learning progress and practice data are stored locally on this device.</p> <button class="btn btn-danger" data-action="reset-progress">Reset Student Progress</button> </div> <div class="card"> <h3>👨🏽‍🏫 Teacher Settings</h3> <p>Teacher mode provides assessment generation, marking schemes and exam printing.</p> <button class="btn btn-secondary" data-action="teacher-mode">Switch to Teacher</button> </div> <div class="card"> <h3>📚 Topic Settings</h3> <p>Use SHS1, SHS2 and SHS3 filters from the Topics library.</p> <button class="btn btn-secondary" data-page="topics">Open Topics</button> </div> <div class="card"> <h3>📝 Practice Settings</h3> <p>Practice currently uses 10 mixed objective questions per attempt.</p> <button class="btn btn-secondary" data-page="practice">Open Practice</button> </div> <div class="card"> <h3>🤖 Assistant Settings</h3> <p>Choose detailed, simple, examination or case-analysis response styles.</p> <button class="btn btn-secondary" data-page="assistant">Open Assistant</button> </div> <div class="card"> <h3>📸 Scanner Settings</h3> <p>Use camera/upload to prepare a question for secure AI analysis.</p> <button class="btn btn-secondary" data-page="scanner">Open Scanner</button> </div> </div> </section>`; } function resetProgress(){ if(confirm("Reset all student progress and practice statistics on this device?")){ APP.completed=[]; APP.practiceScore=0; APP.practiceAttempts=0; saveState(); render(); toast("Progress reset."); } } function renderAbout(){ $("#main").innerHTML=` <section class="hero"> <div class="hero-card"> <div class="eyebrow">About</div> <h1>BM Learn AI</h1> <p> A learner-centred Business Management platform designed to help Ghana SHS students understand concepts, apply knowledge and develop examination thinking. </p> </div> </section> <section class="section"> <div class="grid"> <div class="card"> <h3>📚 Deep Learning</h3> <p>Lessons go beyond short definitions and include explanations, examples, cases and trial essays.</p> </div> <div class="card"> <h3>🧠 Critical Thinking</h3> <p>Students are encouraged to analyse situations, compare alternatives and justify decisions.</p> </div> <div class="card"> <h3>👨🏽‍🏫 Teacher Support</h3> <p>Teachers can generate varied practice examinations and corresponding marking guidance.</p> </div> </div> </section>`; } /* ============================================================ UTILITIES ============================================================ */ function shuffle(array){ const arr=[...array]; for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; } function printExam(){ window.print(); } /* ============================================================ EVENT SYSTEM ============================================================ */ document.addEventListener("click",event=>{ const roleBtn=event.target.closest("[data-role]"); if(roleBtn){ setRole(roleBtn.dataset.role); return; } const pageBtn=event.target.closest("[data-page]"); if(pageBtn){ navigate(pageBtn.dataset.page); return; } const filterBtn=event.target.closest("[data-filter]"); if(filterBtn){ APP.topicFilter=filterBtn.dataset.filter; renderTopics(); return; } const topicBtn=event.target.closest("[data-topic]"); if(topicBtn){ const topic=topics.find(t=>t.id===topicBtn.dataset.topic); if(topic) renderLesson(topic); return; } const action=event.target.closest("[data-action]"); if(!action) return; switch(action.dataset.action){ case "reload": location.reload(); break; case "close-modal": closeModal(); break; case "complete-topic": markComplete(action.dataset.id); if(APP.currentTopic) renderLesson(APP.currentTopic); break; case "start-practice": startPractice(); break; case "open-scanner": openScanner(); break; case "paste-question": pasteQuestion(); break; case "solve-scan": solveScan(); break; case "analyse-text": analyseText(); break; case "ask-assistant": askAssistant(); break; case "generate-exam": generateExam(); break; case "show-marking": showMarking(); break; case "print-exam": printExam(); break; case "reset-progress": resetProgress(); break; case "teacher-mode": setRole("teacher"); navigate("teacher"); break; } }); $("#menuBtn").addEventListener("click",()=>{ $("#menu").classList.toggle("open"); }); $("#closeModal").addEventListener("click",closeModal); $("#modal").addEventListener("click",e=>{ if(e.target === $("#modal")) closeModal(); }); document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); }); $("#scanInput").addEventListener("change",e=>{ handleScan(e.target.files?.[0]); }); document.addEventListener("input",e=>{ if(e.target.id==="topicSearch"){ APP.topicSearch=e.target.value; renderTopics(); const input=$("#topicSearch"); if(input){ input.focus(); input.setSelectionRange(input.value.length,input.value.length); } } }); /* ============================================================ START ============================================================ */ render(); </script> </body> </html>
