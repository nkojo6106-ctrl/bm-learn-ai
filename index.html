<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>BM Learn AI — Sir Koala 🐨</title>
<style>
:root{
 --navy:#06142d;--navy2:#0b1e3d;--blue:#147cff;--blue2:#36a3ff;
 --gold:#f5c84c;--gold2:#ffe08a;--white:#f8fbff;--muted:#a9b9d2;
 --card:#10284c;--card2:#15345f;--green:#27d58b;--red:#ff5f76;
 --shadow:0 16px 45px rgba(0,0,0,.28);--radius:20px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(160deg,var(--navy),#081a37 60%,#06142d);color:var(--white)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
body{overflow-x:hidden}
.hidden{display:none!important}
#loginScreen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 0,#164f9b 0,#07172f 45%,#030b19 100%)}
.login-card{width:min(520px,100%);padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(9,28,58,.94);box-shadow:var(--shadow);text-align:center}
.logo{width:70px;height:70px;border-radius:22px;display:grid;place-items:center;margin:0 auto 10px;background:linear-gradient(135deg,var(--blue),#0b4fa8);font-size:36px;box-shadow:0 10px 30px rgba(20,124,255,.28)}
.brand{font-weight:900;font-size:28px}.brand span{color:var(--gold)}
.sub{color:var(--muted);line-height:1.55}
.login-input{width:100%;padding:15px 16px;border-radius:14px;border:1px solid #2b4c76;background:#081a35;color:white;outline:none;margin:14px 0}
.login-input:focus{border-color:var(--blue)}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 16px}
.role-btn{padding:16px;border-radius:16px;border:1px solid #31527b;background:#0c2243;color:white;font-weight:800}
.role-btn.active{border-color:var(--gold);background:linear-gradient(135deg,#123d72,#0d2b52);box-shadow:0 0 0 2px rgba(245,200,76,.14)}
.primary{border:0;padding:14px 18px;border-radius:14px;background:linear-gradient(135deg,var(--blue),#0757c7);color:#fff;font-weight:900;box-shadow:0 8px 20px rgba(20,124,255,.25)}
.gold{background:linear-gradient(135deg,var(--gold),#d89e15);color:#06142d}
.secondary{border:1px solid #31527b;padding:12px 15px;border-radius:13px;background:#0c2243;color:#fff;font-weight:800}
.danger{background:#4a1725;border-color:#743143}
header{position:sticky;top:0;z-index:50;background:rgba(6,20,45,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.header-inner{max-width:1180px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.mini-logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),#0757c7);font-size:22px}
.header-title{font-weight:900;line-height:1.1}.header-title small{display:block;color:var(--gold);font-size:11px;margin-top:2px}
.hello{margin-left:auto;font-weight:800;font-size:14px}.role-pill{font-size:11px;color:var(--gold);border:1px solid rgba(245,200,76,.35);padding:6px 9px;border-radius:999px}
.menu-btn{width:42px;height:42px;border:1px solid #29466c;border-radius:12px;background:#0c2243;color:white;font-size:20px}
main{max-width:1180px;margin:auto;padding:18px 16px 50px}
.hero{border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:24px;background:linear-gradient(135deg,#0d3264,#092143 62%,#111c34);box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero:after{content:"🐨";position:absolute;right:20px;bottom:-12px;font-size:90px;opacity:.12;pointer-events:none}
.hero h1{margin:0 0 8px;font-size:clamp(26px,7vw,44px)}.hero h1 span{color:var(--gold)}
.hero p{max-width:700px;color:#c4d2e7;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:linear-gradient(145deg,var(--card),#0c2140);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.card h3{margin:0 0 7px}.card p{color:var(--muted);line-height:1.5;margin:0 0 12px;font-size:14px}
.stat{font-size:25px;font-weight:900;color:var(--gold)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:25px 0 12px}.section-title h2{margin:0}
.topic-card{min-height:150px}.topic-no{color:var(--gold);font-weight:900;font-size:12px}.topic-card h3{font-size:17px;margin:7px 0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar>*{flex:1 1 140px}
input,select,textarea{width:100%;background:#081a35;color:white;border:1px solid #29466c;border-radius:13px;padding:12px;outline:none}
textarea{min-height:130px;resize:vertical}
label{display:block;font-size:12px;font-weight:800;color:#c6d5e9;margin:10px 0 6px}
.content p,.content li{color:#d3deee;line-height:1.65}.content h3{color:var(--gold2);margin-top:22px}.content h4{color:#9ed2ff}.content strong{color:white}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#12335d;color:#a9d6ff;font-size:11px;font-weight:800;margin:3px}
.case{border-left:4px solid var(--gold);padding:14px 16px;background:#0b1d39;border-radius:12px;margin:12px 0;color:#dce7f7;line-height:1.65}
.q{border:1px solid #27476f;border-radius:15px;padding:15px;margin:11px 0;background:#0b2040}.q p{margin:0 0 9px;line-height:1.55}
.answer{margin-top:8px;padding:10px;border-radius:10px;background:#07172f;color:#bcd1eb}
.drawer{position:fixed;z-index:90;right:12px;top:66px;width:min(350px,calc(100% - 24px));max-height:calc(100dvh - 82px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#071a35;border:1px solid #29466c;border-radius:20px;box-shadow:var(--shadow);padding:10px}
.nav-item{display:block;width:100%;text-align:left;border:0;background:transparent;color:#e8f1fc;padding:13px;border-radius:12px;font-weight:800}
.nav-item:hover{background:#0f2b52}.nav-item small{display:block;color:#8099b9;font-weight:500;margin-top:2px}
.notice{padding:12px 14px;border-radius:13px;background:#102f57;border:1px solid #285581;color:#cfe2fa;margin:12px 0;line-height:1.5}
.notice.warn{background:#3c2f0e;border-color:#6b5b1e}.notice.ok{background:#0c392a;border-color:#1c6a50}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #254363;text-align:left;vertical-align:top}th{color:var(--gold)}
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}.modal-box{width:min(700px,100%);max-height:90vh;overflow:auto;background:#092044;border:1px solid #31527b;border-radius:22px;padding:20px}
.footer{text-align:center;color:#7891b2;font-size:12px;padding:30px 0}.footer b{color:var(--gold)}
.toast{position:fixed;z-index:300;left:50%;bottom:22px;transform:translateX(-50%);background:#0b2343;border:1px solid #31527b;color:white;padding:11px 15px;border-radius:999px;box-shadow:var(--shadow);font-size:13px}
.badge{font-size:10px;padding:4px 7px;border-radius:999px;background:#16395f;color:#a9d7ff}.done{color:var(--green)}
@media(max-width:600px){.hello{font-size:12px}.role-pill{display:none}.grid{grid-template-columns:1fr 1fr}.hero{padding:19px}.header-title{font-size:14px}}

/* Teacher dashboard — distinct green theme so role is visually obvious */
body.role-teacher{background:linear-gradient(160deg,#06231a,#082a1f 60%,#04150f)}
body.role-teacher header{background:rgba(6,32,20,.94)}
body.role-teacher .mini-logo{background:linear-gradient(135deg,#1ca672,#0a6b46)}
body.role-teacher .hero{background:linear-gradient(135deg,#0d3d2c,#0a2e22 62%,#0f1f1c)}
body.role-teacher .hero:after{opacity:.10;pointer-events:none}
body.role-teacher .hero h1 span{color:#8bffb0}
body.role-teacher .role-pill{color:#8bffb0;border-color:rgba(139,255,176,.35)}
body.role-teacher .card{background:linear-gradient(145deg,#0f3626,#0b2a1e);border-color:rgba(139,255,176,.1)}
body.role-teacher .stat{color:#8bffb0}
body.role-teacher .primary{background:linear-gradient(135deg,#1ca672,#0a6b46);box-shadow:0 8px 20px rgba(28,166,114,.25)}
body.role-teacher .gold{background:linear-gradient(135deg,#8bffb0,#2fbf82);color:#04150f}
body.role-teacher .secondary,body.role-teacher .menu-btn{border-color:#1f5a41;background:#0c2b1e}
body.role-teacher .nav-item:hover{background:#123d2c}
body.role-teacher .drawer{background:#071f16;border-color:#1f5a41}
body.role-teacher .content h3{color:#c8ffdf}
body.role-teacher .content h4{color:#9ef5c4}
body.role-teacher .topic-no{color:#8bffb0}
body.role-teacher .pill{background:#123d2c;color:#a9f5cf}
body.role-teacher .badge{background:#123d2c;color:#a9f5cf}
body.role-teacher .case{border-left-color:#3fd699;background:#0a2419}
body.role-teacher .q{background:#0a2419;border-color:#1f5a41}
body.role-teacher .notice{background:#0f3626;border-color:#1c6a50;color:#cdf5e0}
body.role-teacher .notice.warn{background:#3c2f0e;border-color:#6b5b1e}
body.role-teacher .notice.ok{background:#0c392a;border-color:#1c6a50}
body.role-teacher input,body.role-teacher select,body.role-teacher textarea{background:#071f16;border-color:#1f5a41}
body.role-teacher th{color:#8bffb0}
body.role-teacher table td,body.role-teacher table th{border-color:#1f5a41}

@media print{
 body,body.role-teacher{background:#fff!important;color:#000!important}
 header,#drawer,#loginScreen,.menu-btn,.toast,.modal,.toolbar button{display:none!important}
 main{max-width:100%;padding:0}
 .card,.hero,.case,.q,.content{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
 .hero:after{display:none}
 a,button{color:#000}
}

</style>

 <div class="header-inner">

<script>
"use strict";

/* =========================================================
   BM LEARN AI — single-file prototype
   Real AI endpoint: keep blank unless you have a secure backend.
   Never put a secret API key in this public HTML.
========================================================= */
const AI_ENDPOINT = "";

const topics = [
 {id:1,name:"Forms of Business",range:"1–3",desc:"Sole proprietor, partnership, companies and state-owned enterprises."},
 {id:4,name:"Functions of Management",range:"4",desc:"Planning, organising, leading, controlling and coordination."},
 {id:5,name:"Business Development",range:"5",desc:"Growth, internal & external environment, SWOT, PESTLE, business ethics and CSR."},
 {id:21,name:"Entrepreneurship",range:"5b",desc:"Entrepreneurs, business ideas, business plans, challenges and support in Ghana."},
 {id:6,name:"International Business & E-Business",range:"6",desc:"Global trade, exporting, importing and digital business."},
 {id:7,name:"Functional Areas of Management",range:"7–8",desc:"Major functional areas and their contribution to business performance."},
 {id:9,name:"Law of Contract",range:"9–10",desc:"Formation, essential elements, breach, remedies and dispute resolution."},
 {id:22,name:"Communication in Business",range:"10b",desc:"Business communication, barriers, channels and effective communication."},
 {id:11,name:"Business Risk & Insurance",range:"11",desc:"Risk identification, management and insurance principles."},
 {id:12,name:"Human Resource Management",range:"12",desc:"Recruitment, selection, training, performance and employee relations."},
 {id:13,name:"Leadership & Leadership Theories",range:"13–17",desc:"Leadership theories, styles, power, centralisation and decentralisation."},
 {id:18,name:"Marketing",range:"18",desc:"Marketing, segmentation, target markets, marketing mix and strategy."},
 {id:19,name:"Finance",range:"19",desc:"Business finance, sources of finance, cash flow and investment decisions."},
 {id:20,name:"Production & Operations",range:"20",desc:"Production systems, quality, productivity, inventory and operations."},
 {id:23,name:"Government & Business",range:"21",desc:"How government influences business through policy, tax, regulation and SOEs."}
];

const legalCases = [
 {title:"Carlill v Carbolic Smoke Ball Co",cite:"[1893] 1 QB 256",point:"Offer",text:"The company advertised that it would pay £100 to anyone who used its smoke ball as directed and still caught influenza, stating that £1,000 had been deposited. Mrs Carlill complied and became ill. The court held that the advertisement was a unilateral offer capable of acceptance by performance, and the company was bound to pay."},
 {title:"Hyde v Wrench",cite:"(1840) 3 Beav 334",point:"Acceptance / counter-offer",text:"Wrench offered to sell property for £1,000. Hyde offered £950; Wrench rejected it. Hyde later tried to accept the original £1,000 offer. The court held that the £950 proposal was a counter-offer that destroyed the original offer, so there was no contract."},
 {title:"Balfour v Balfour",cite:"[1919] 2 KB 571",point:"Intention to create legal relations",text:"A husband promised to send his wife a monthly allowance while they lived apart. The court held that ordinary domestic arrangements between spouses were presumed not to be intended as legally binding, so the promise was not enforceable on the facts."},
 {title:"Currie v Misa",cite:"(1875) LR 10 Ex 153",point:"Consideration",text:"The case is a classic authority on consideration. The court explained consideration as a legal benefit to one party or detriment undertaken by the other, supporting a promise in a simple contract."},
 {title:"Hadley v Baxendale",cite:"(1854) 9 Exch 341",point:"Damages / remoteness",text:"A mill crankshaft was delayed by a carrier, causing lost profits. The court established that recoverable losses are generally those arising naturally from the breach or those within the reasonable contemplation of both parties when contracting."},
 {title:"L'Estrange v Graucob",cite:"[1934] 2 KB 394",point:"Contract terms / signature",text:"A buyer signed a sales document containing an exclusion clause without reading it. The court held that, absent fraud or misrepresentation, a person who signs a contractual document is generally bound by its terms."}
];

const examSets = [
 {case:"Adom Foods Ltd is a Ghanaian food-processing company operating in Kumasi. After several years of growth, management decides to enter neighbouring West African markets. The company has received enquiries from retailers in Côte d’Ivoire, Togo and Nigeria. Its directors are divided: one group wants to export directly, another wants to use local distributors, while the finance manager warns that exchange-rate movements, transport costs, product standards and unfamiliar laws may affect profitability. The marketing manager also argues that the company should research each market before choosing a target segment. At the same time, the human resource manager says staff will need training in cross-border customer service and digital communication. The board asks the management team to prepare a reasoned recommendation before committing company funds.",qs:["Explain four factors Adom Foods Ltd should consider before entering the foreign markets. (5 marks)","Discuss three benefits the company may gain from exporting rather than immediately establishing a foreign subsidiary. (4 marks)","Recommend the most suitable entry approach for the first stage and justify your answer using the facts in the case. (6 marks)"]},
 {case:"KenteTech Manufacturing Ltd produces affordable school uniforms and workwear in Ghana. Sales have grown rapidly, but the firm is experiencing rising production costs, late deliveries and customer complaints about inconsistent sizes. The managing director wants to increase output, while the operations manager argues that expanding before correcting quality problems could damage the brand. The HR manager reports that some new employees were recruited quickly without proper induction. The marketing manager has identified different customer groups with different needs and wants the company to stop treating the whole market as one group. The board has asked management to develop an integrated plan that improves efficiency, quality and customer satisfaction before the next academic year.",qs:["Analyse three management problems revealed by the case and show how each could affect performance. (5 marks)","Explain four ways market segmentation could help KenteTech serve its customers more effectively. (4 marks)","Design a practical action plan, using management functions, that could improve the company's performance before the next academic year. (6 marks)"]},
 {case:"Apex Logistics Ghana Ltd signs a one-year agreement with a retailer to deliver imported electronics. The agreement states the delivery dates, prices, insurance responsibilities and payment terms. After fuel prices rise sharply, Apex informs the retailer that it will stop deliveries unless the retailer pays a higher price. The retailer refuses and hires another carrier. Apex argues that the retailer has breached the agreement, while the retailer claims Apex committed anticipatory breach first. The parties attempt negotiation but fail. They are considering mediation and arbitration before going to court. Meanwhile, the retailer claims that its lost sales should be compensated.",qs:["Identify and explain the contractual issue arising from Apex's refusal to continue performance. (5 marks)","Explain two dispute-resolution methods the parties could use and distinguish them from court litigation. (4 marks)","Advise the parties on the principles that may affect recovery of damages for the retailer's losses. (6 marks)"]},
 {case:"Bright Farms Ltd is a growing agribusiness employing 85 workers. The founder makes almost every important decision personally, including purchases, recruitment and customer complaints. As the company expands into three regions, supervisors complain that decisions take too long. Some employees want more authority to solve routine problems, but the founder fears losing control. The HR manager proposes training supervisors and introducing clear reporting lines. The operations manager suggests decentralising selected decisions while retaining central control over major financial and strategic matters. The board asks for a balanced recommendation.",qs:["Explain three disadvantages of excessive centralisation in Bright Farms Ltd. (5 marks)","State four factors that should influence the decision to decentralise authority. (4 marks)","Recommend how Bright Farms could combine centralisation and decentralisation effectively. Give reasons. (6 marks)"]},
 {case:"Unity Textiles Ltd has received an order from a large overseas buyer. The order is profitable but requires the company to increase production within six weeks. Management is considering borrowing money to purchase machinery and recruit temporary workers. The finance manager warns about interest costs and cash-flow pressure. The production manager is concerned about quality. The HR manager wants fair recruitment and adequate training. The marketing manager believes the overseas buyer could become a long-term customer if service quality is maintained. Management must decide whether to accept the order and how to manage the associated risks.",qs:["Identify and explain four risks Unity Textiles may face if it accepts the order. (5 marks)","Explain four measures the company can use to manage or reduce the identified risks. (4 marks)","Using the case, assess whether accepting the order is a sound business decision. (6 marks)"]},
 {case:"Nhyira Services Ltd operates a chain of small service centres. Customer feedback shows that young customers value speed and digital communication, business clients value reliability and detailed records, while older customers often prefer face-to-face assistance. Management initially wants one identical service package for everyone. The marketing manager argues that the company should identify meaningful segments and develop a clear target market. The finance manager worries that creating different service packages will increase costs. Management therefore wants an evidence-based marketing decision that balances customer value and profitability.",qs:["Distinguish between market segmentation and target marketing. (5 marks)","Explain four bases on which Nhyira Services could segment its market. (4 marks)","Recommend a targeting strategy and show how the marketing mix could support it. (6 marks)"]},
 {case:"Golden Breweries Ltd has experienced declining employee morale despite strong sales. Workers complain that supervisors rarely recognise good performance and mostly intervene when mistakes occur. A newly appointed manager proposes a transformational approach based on a clear vision, employee development and participation in problem-solving. Another manager prefers a transactional approach using measurable targets, rewards and corrective action. A third manager argues that leaders should put employees' needs first and develop their potential. Senior management wants to choose an approach appropriate to the company's present situation.",qs:["Explain the main features of transformational leadership. (5 marks)","Distinguish transactional leadership from servant leadership. (4 marks)","Recommend a leadership approach or combination of approaches for Golden Breweries and justify your answer. (6 marks)"]},
 {case:"Mansa Trading Ltd is considering converting its growing business into a company. The founder currently operates as a sole proprietor and enjoys complete control, but personal liability worries her because the business has borrowed money to expand. A potential investor wants limited liability and an ownership interest that can continue even if one owner leaves. Another investor is interested in a partnership because it could be easier to establish. The founder asks an adviser to compare the available forms of business before making a decision.",qs:["Explain three advantages and two disadvantages of operating as a sole proprietor. (5 marks)","Explain four features of a company that distinguish it from a sole proprietorship. (4 marks)","Advise the founder on the most suitable form of business, giving reasons based on the case. (6 marks)"]},
 {case:"Coastal Manufacturing Ltd imports some raw materials and sells finished goods to Ghanaian and regional customers. A sudden depreciation of the cedi increases the local-currency cost of imported inputs. At the same time, a competitor begins offering cheaper substitutes. Management is considering changing suppliers, reviewing prices, improving product differentiation and entering an online sales channel. The finance manager wants to protect cash flow, while the marketing manager wants to maintain customer loyalty. The managing director asks for an integrated response rather than a single departmental solution.",qs:["Explain three effects of currency depreciation on Coastal Manufacturing Ltd. (5 marks)","Discuss four marketing responses the company could use against the competitor. (4 marks)","Develop an integrated recommendation covering finance, marketing and operations. (6 marks)"]},
 {case:"A public enterprise responsible for an essential service has been criticised for delays, rising operating costs and weak accountability. Government wants the enterprise to improve efficiency while continuing to serve the public interest. Some stakeholders propose stronger managerial autonomy and performance targets; others fear that commercial pressures could reduce access for low-income citizens. Management is reviewing governance, financing, leadership and customer-service practices before submitting a reform proposal.",qs:["Explain four characteristics of a state-owned enterprise. (5 marks)","Discuss two advantages and two challenges of state ownership. (4 marks)","Propose a balanced reform plan that improves efficiency without abandoning the public-service objective. (6 marks)"]}
];

const essayCaseBank = [
 {title:"Leadership Style Shift at Adepa Motors",case:"Adepa Motors Ltd has grown from a small workshop into a 60-employee vehicle-servicing company. The founder still makes almost every decision, including approving minor repairs. Staff say they feel unable to use initiative, and two experienced mechanics recently resigned. A new operations manager wants to introduce more employee participation and a clear vision for the company's next phase of growth.",
  questions:[
   {text:"Explain what is meant by transformational leadership.",marks:4,guide:"Look for vision, inspiration, employee development — not just a definition of 'good leadership'."},
   {text:"Distinguish transformational leadership from transactional leadership.",marks:4,guide:"Should contrast vision/change vs exchange of rewards for performance."},
   {text:"Identify two leadership problems evident in the case.",marks:4,guide:"Accept: over-centralisation, low participation, staff turnover, no vision-sharing."},
   {text:"Explain two benefits Adepa Motors could gain from a more participative leadership style.",marks:4,guide:"Look for improved morale, retention, faster decisions at branch level, innovation."},
   {text:"Recommend, with reasons, a leadership approach for the operations manager to adopt.",marks:4,guide:"Reward answers that justify the choice using facts from the case, not a generic definition."}
  ]},
 {title:"Segmenting the Market for Nkosuo Snacks",case:"Nkosuo Snacks Ltd sells one packaged snack product nationwide using a single price and a single advertising message. Sales have plateaued. Research shows students want cheaper, smaller packs, while working professionals want premium, larger packs delivered to offices. The marketing manager wants to stop treating the whole market as one group.",
  questions:[
   {text:"Explain the meaning of market segmentation.",marks:4,guide:"Dividing a broad market into groups with similar needs/characteristics."},
   {text:"Identify two bases of segmentation illustrated in the case.",marks:4,guide:"Demographic (student vs professional/income) and behavioural (pack size/usage)."},
   {text:"Distinguish market segmentation from target marketing.",marks:4,guide:"Segmentation = dividing the market; targeting = selecting which segment(s) to serve."},
   {text:"Explain two risks of continuing an undifferentiated marketing approach.",marks:4,guide:"Lost sales to competitors, failure to meet specific needs, stagnant growth."},

function updateStreak(){
  const s=getStreak(),today=new Date().toISOString().slice(0,10);
  if(s.last===today)return;
  const y=new Date();y.setDate(y.getDate()-1);const yest=y.toISOString().slice(0,10);
  s.count=(s.last===yest)?(s.count||0)+1:1;s.last=today;
  try{localStorage.setItem("bm_streak",JSON.stringify(s))}catch(e){}
}
function getBadges(){
  const badges=[],prog=countProgress(),atts=attempts(),streak=getStreak().count||0;
  if(prog>=1)badges.push("First topic read");
  if(prog>=5)badges.push("5 topics covered");
  if(prog>=topics.length)badges.push("All topics visited");
  if(atts.length>=1)badges.push("First test done");
  if(atts.some(a=>a.score>=16))badges.push("High scorer (16+/20)");
  if(streak>=3)badges.push("3-day streak");
  if(streak>=7)badges.push("7-day streak");
  return badges;
}
