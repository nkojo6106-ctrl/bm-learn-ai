function formsContent(){return `
<h3>Meaning and broad classification</h3><p>A form of business is the legal and ownership arrangement under which an enterprise is established, controlled, financed and operated. The form affects ownership, liability, continuity, taxation, decision-making and access to finance.</p>
<h3>Sole Proprietorship</h3><p>A business owned and controlled by one person. The owner normally takes decisions, receives the residual profit and bears the business risk. In the ordinary sole-proprietor structure, there is no separate legal personality between owner and business.</p>
<h4>Formation</h4><ol><li>Choose an acceptable business name where required.</li><li>Complete the applicable registration process.</li><li>Obtain the relevant registration certificate/licences and comply with local requirements.</li><li>Arrange premises, finance, records and operating resources.</li></ol>
<h4>Features</h4><ul><li>Single owner.</li><li>Centralised decision-making.</li><li>Generally unlimited liability.</li><li>Owner receives profits after expenses and bears losses.</li><li>Usually easy to establish compared with more complex structures.</li></ul>
<h4>Advantages</h4><ul><li>Quick decisions and high control.</li><li>Simple management structure.</li><li>Close relationship with customers.</li><li>Owner retains profits.</li><li>Business information can be kept relatively private.</li></ul>
<h4>Disadvantages</h4><ul><li>Unlimited personal exposure to business debts.</li><li>Limited access to large-scale capital.</li><li>Heavy workload for the owner.</li><li>Continuity can depend heavily on the owner.</li><li>Specialist skills may be limited.</li></ul>
<h4>Sources of finance</h4><p>Owner's savings, retained profits, bank/credit facilities, trade credit, family support where appropriate, microfinance and other lawful sources.</p>
<h3>Partnership</h3><p>A partnership is a business carried on by two or more persons who agree to operate together and share profits according to the agreement and applicable law.</p>
<h4>Formation</h4><ol><li>Identify the partners and business purpose.</li><li>Agree responsibilities, capital contributions, profit/loss sharing and decision rules.</li><li>Prepare a partnership agreement.</li><li>Complete applicable registration and licensing requirements.</li></ol>
<h4>Features</h4><ul><li>Two or more owners.</li><li>Shared capital, skills and responsibility.</li><li>Profit-sharing arrangement.</li><li>Mutual agency may arise: a partner can bind the firm when acting within authority.</li><li>Liability depends on the type of partnership and applicable law.</li></ul>
<h4>Advantages</h4><ul><li>More capital than a single owner may provide.</li><li>Combined skills and experience.</li><li>Shared workload.</li><li>Potentially broader business contacts.</li><li>Relatively flexible compared with a large company.</li></ul>
<h4>Disadvantages</h4><ul><li>Possibility of disagreements.</li><li>Profits must be shared.</li><li>Actions of one partner can create consequences for the firm within the law.</li><li>Some forms expose partners to substantial personal liability.</li><li>Continuity may be affected by changes among partners.</li></ul>
<h4>Sources of finance</h4><p>Partners' capital, retained profits, bank loans, trade credit and other lawful finance.</p>
<h3>Companies</h3><p>A company is an incorporated business organisation recognised by law as a separate legal person. Common forms include private/public companies and companies limited by shares, subject to the applicable company law.</p>
<h4>Formation and features</h4><ul><li>Registration/incorporation under applicable company law.</li><li>Separate legal personality.</li><li>Perpetual succession in appropriate forms.</li><li>Ownership and management can be separated.</li><li>Limited liability may protect members, subject to law and exceptions.</li></ul>
<h4>Advantages</h4><ul><li>Potential to raise substantial capital.</li><li>Continuity.</li><li>Limited liability in relevant structures.</li><li>Greater credibility for some transactions.</li><li>Ownership can be structured through shares.</li></ul>
<h4>Disadvantages</h4><ul><li>More formation and compliance requirements.</li><li>Higher administrative cost.</li><li>Less direct control for individual shareholders.</li><li>More formal reporting and governance.</li></ul>
<h4>Sources of finance</h4><p>Share capital, retained earnings, loans, debentures/bonds where applicable, trade credit and other lawful corporate finance.</p>
<h3>State-Owned Enterprises (SOEs)</h3><p>An SOE is an enterprise owned or controlled by the state, normally established to provide goods/services and/or pursue public policy objectives alongside efficiency goals.</p>
<h4>Features</h4><ul><li>Public ownership or significant state control.</li><li>Public-service or strategic objectives may be important.</li><li>Government oversight and accountability.</li><li>May operate commercially while serving social objectives.</li></ul>
<h4>Advantages</h4><ul><li>Can provide essential services.</li><li>Can support national development and strategic sectors.</li><li>May operate where private investment is insufficient.</li><li>Can create employment and infrastructure.</li></ul>
<h4>Disadvantages/challenges</h4><ul><li>Political interference may affect decisions.</li><li>Weak incentives can reduce efficiency.</li><li>Public funds may be exposed to losses.</li><li>Balancing commercial and social objectives can be difficult.</li></ul>
<h4>Sources of finance</h4><p>Government allocations/equity, internally generated funds, loans, grants and other approved sources.</p>
<h3>Exam focus</h3><p>Always compare forms using ownership, liability, continuity, capital, control and legal personality. In an essay, link the recommended form to the facts rather than merely listing advantages.</p>
<h3>Trial questions</h3><ol><li>Compare sole proprietorship and partnership under five headings.</li><li>Explain why a growing business may convert from sole proprietorship to a company.</li><li>Assess whether an SOE should be judged only by profit.</li></ol>`}
function managementContent(){return `<h3>Functions of Management</h3><p>Management involves coordinating people and resources through planning, organising, leading and controlling to achieve objectives efficiently and effectively.</p><h3>Planning</h3><p>Deciding objectives in advance and determining actions, resources, timing and responsibility.</p><h3>Organising</h3><p>Arranging tasks, authority, people and resources into a workable structure.</p><h3>Leading</h3><p>Influencing, directing, motivating and communicating with employees to achieve goals.</p><h3>Controlling</h3><p>Setting standards, measuring actual performance, comparing results and taking corrective action.</p><h3>Coordination</h3><p>Integrating activities of departments and individuals so that efforts support one another.</p><h3>Critical thinking</h3><p>A manager who plans well but never checks actual performance has created a control gap. A strong answer should explain the link between the functions rather than treating them as isolated activities.</p><h3>Trial questions</h3><ol><li>Explain how planning and controlling are interdependent.</li><li>Assess the effects of poor organising on business performance.</li><li>Design a management response to a department that repeatedly misses targets.</li></ol>`}
function businessDevContent(){return `
<h3>Business Development</h3>
<p>Business development involves identifying opportunities, building relationships and implementing strategies that create sustainable growth. It covers opportunity identification, market research, customer relationships, strategic partnerships, new products and markets, digital channels, innovation and competitive analysis. Growth decisions are commonly analysed using market penetration, market development, product development and diversification. Rapid growth can create financing pressure, operational complexity, quality problems, staffing gaps and strategic overreach.</p>

<h3>Internal Environment of Business</h3>
<p>The internal environment consists of factors <b>inside</b> the organisation that management can influence or control. These factors shape the firm’s ability to pursue opportunities and respond to threats.</p>
<h4>Main internal factors</h4>
<ul>
<li><b>Resources:</b> financial resources (cash, credit, retained earnings), physical resources (buildings, machinery, inventory), human resources (skills, experience, motivation) and technological resources (systems, software, production methods).</li>
<li><b>Structure and systems:</b> organisational structure, reporting lines, decision-making processes, information systems and control systems.</li>
<li><b>Culture and leadership:</b> shared values, attitudes, leadership style, communication patterns and employee commitment.</li>
<li><b>Capabilities and core competencies:</b> distinctive skills, processes or knowledge that give the firm an advantage (for example strong brand, efficient logistics or specialist technical skill).</li>
<li><b>Operations and processes:</b> production methods, quality systems, supply-chain arrangements and service delivery processes.</li>
<li><b>Marketing and customer base:</b> existing products, brand reputation, distribution channels and customer loyalty.</li>
<li><b>Finance and performance:</b> profitability, liquidity, cost structure and access to additional capital.</li>
</ul>
<p>A strong internal environment supports growth; weaknesses (skill gaps, weak cash flow, outdated technology or rigid structure) limit what the firm can realistically achieve.</p>

<h3>Application of the SWOT Tool to Analyse the Internal Environment</h3>
<p>SWOT analysis examines <b>Strengths, Weaknesses, Opportunities and Threats</b>. For the <b>internal environment</b>, the focus is on <b>Strengths</b> and <b>Weaknesses</b> — the factors the firm largely controls.</p>
<h4>Strengths (internal positives)</h4>
<ul>
<li>Skilled and experienced workforce</li>
<li>Strong brand reputation or customer loyalty</li>
<li>Efficient production or low unit costs</li>
<li>Modern technology or proprietary know-how</li>
<li>Healthy cash flow or access to finance</li>
<li>Effective leadership and clear organisational culture</li>
<li>Reliable suppliers or well-managed inventory</li>
</ul>
<h4>Weaknesses (internal negatives)</h4>
<ul>
<li>Limited capital or poor cash-flow management</li>
<li>Outdated machinery or weak quality control</li>
<li>Skill shortages or high staff turnover</li>
<li>Narrow product range or weak marketing</li>
<li>Rigid hierarchy that slows decisions</li>
<li>Dependence on a single product, customer or supplier</li>
<li>Weak financial controls or inadequate records</li>
</ul>
<div class="case"><b>Ghanaian example — applying SWOT to the internal environment</b><br>
A small fruit-juice processor in Kumasi might list as <b>strengths</b>: good local fruit supply contracts, a recognised brand in Ashanti Region, and experienced production staff. <b>Weaknesses</b> might include limited packaging machinery, weak national distribution, and dependence on seasonal cash flow. Management can then decide whether to invest in packaging capacity, seek a distributor partnership, or improve working-capital management before expanding.</div>
<p><b>Exam tip:</b> When asked to analyse the internal environment using SWOT, clearly separate strengths from weaknesses, link each point to the firm’s facts, and show how the analysis informs a decision (for example whether the firm is ready to expand).</p>

<h3>External Environment of Business</h3>
<p>The external environment consists of factors <b>outside</b> the organisation that management cannot fully control but must monitor and respond to. These factors create opportunities and threats.</p>
<h4>Main external factors</h4>
<ul>
<li><b>Economic:</b> inflation, interest rates, exchange rates, unemployment, growth in national income and consumer purchasing power.</li>
<li><b>Political and legal:</b> government policy, taxation, regulation, licensing, trade agreements and political stability.</li>
<li><b>Social and cultural:</b> demographics, lifestyles, education levels, attitudes to work and consumption patterns.</li>
<li><b>Technological:</b> new production methods, digital platforms, automation, communication technology and research developments.</li>
<li><b>Competitive:</b> number and strength of rivals, threat of new entrants, substitute products and bargaining power of buyers and suppliers.</li>
<li><b>Environmental / ecological:</b> climate, natural resources, pollution rules and sustainability expectations.</li>
<li><b>Global:</b> international trade conditions, foreign competition and cross-border market opportunities.</li>
</ul>
<p>Because the external environment changes, businesses need continuous environmental scanning and flexible strategies.</p>

<h3>Application of the SWOT and PESTLE Tools to Analyse the External Environment</h3>
<p>For the <b>external environment</b>, SWOT focuses on <b>Opportunities</b> and <b>Threats</b>. PESTLE (sometimes written PESTEL) provides a structured way to scan the wider macro-environment.</p>
<h4>PESTLE factors</h4>
<ul>
<li><b>Political:</b> government stability, policy changes, public spending, trade policy.</li>
<li><b>Economic:</b> growth, inflation, interest rates, exchange rates, disposable income.</li>
<li><b>Social:</b> population structure, education, health, lifestyle trends, cultural values.</li>
<li><b>Technological:</b> innovation, automation, digital commerce, research and development.</li>
<li><b>Legal:</b> employment law, consumer protection, competition law, environmental regulations, company law.</li>
<li><b>Environmental:</b> climate change, resource scarcity, pollution controls, green consumer demand.</li>
</ul>
<h4>Linking PESTLE to SWOT Opportunities and Threats</h4>
<ul>
<li><b>Opportunities</b> arise when external changes favour the firm (for example rising middle-class demand, new export markets, supportive government programmes, or digital platforms that reduce marketing cost).</li>
<li><b>Threats</b> arise when external changes harm the firm (for example currency depreciation that raises import costs, stronger competitors, tighter regulations, or changing consumer tastes).</li>
</ul>
<div class="case"><b>Ghanaian example — SWOT + PESTLE on the external environment</b><br>
A Ghanaian school-uniform manufacturer might identify <b>opportunities</b>: growth in private schools (Social), government support for local manufacturing (Political), and online ordering platforms (Technological). <b>Threats</b> might include cheaper imported uniforms (Competitive/Economic), rising cotton prices linked to exchange-rate movements (Economic), and stricter labour or safety rules (Legal). Using both tools helps the firm decide whether to upgrade quality, enter e-commerce, or seek local-content incentives.</div>
<p><b>Exam tip:</b> Do not merely list PESTLE headings. Apply each relevant factor to the business, then translate the findings into clear opportunities or threats that can guide strategy.</p>

<h3>Business Ethics</h3>
<p>Business ethics refers to the moral principles and standards that guide behaviour in business. Ethical conduct concerns honesty, fairness, respect for stakeholders, compliance with the spirit as well as the letter of the law, and responsibility for the consequences of decisions.</p>
<h4>Why ethics matter</h4>
<ul>
<li>Builds trust with customers, employees, suppliers and the community.</li>
<li>Protects reputation and long-term brand value.</li>
<li>Reduces legal and regulatory risk.</li>
<li>Supports employee morale and retention.</li>
<li>Helps the firm attract investors and partners who value integrity.</li>
</ul>
<h4>Common ethical issues</h4>
<ul>
<li>Honesty in advertising and product claims</li>
<li>Fair treatment of employees (wages, safety, non-discrimination)</li>
<li>Avoidance of bribery and corruption</li>
<li>Respect for customer privacy and data</li>
<li>Environmental responsibility</li>
<li>Fair dealing with suppliers and competitors</li>
<li>Accurate financial reporting</li>
</ul>
<p>Unethical behaviour may produce short-term gains but often damages trust, invites sanctions and undermines sustainability. Ethical decision-making asks not only “Is it legal?” but also “Is it fair, honest and responsible toward stakeholders?”</p>

<h3>Corporate Social Responsibility (CSR)</h3>
<p>Corporate Social Responsibility is the voluntary commitment of a business to operate in ways that contribute positively to society and the environment beyond the minimum legal requirements. CSR recognises that businesses affect many stakeholders — employees, customers, communities, the environment and future generations — and should take responsibility for those effects.</p>
<h4>Main areas of CSR</h4>
<ul>
<li><b>Economic responsibility:</b> remaining viable and creating value.</li>
<li><b>Legal responsibility:</b> obeying laws and regulations.</li>
<li><b>Ethical responsibility:</b> doing what is right even when not required by law.</li>
<li><b>Philanthropic / discretionary responsibility:</b> supporting community projects, education, health and environmental initiatives.</li>
</ul>
<h4>Benefits of CSR</h4>
<ul>
<li>Improved corporate image and brand reputation</li>
<li>Stronger customer loyalty and goodwill</li>
<li>Better employee motivation, attraction and retention</li>
<li>Positive relationships with communities and regulators</li>
<li>Possible long-term cost savings (for example energy efficiency)</li>
<li>Differentiation from competitors</li>
<li>Reduced risk of protests, boycotts or stricter regulation</li>
</ul>
<h4>Challenges of CSR</h4>
<ul>
<li>Additional short-term costs (training, cleaner technology, community projects)</li>
<li>Difficulty measuring social and environmental impact</li>
<li>Risk of “greenwashing” or insincere claims that damage credibility</li>
<li>Pressure from shareholders who prioritise short-term profit</li>
<li>Balancing competing stakeholder expectations</li>
<li>Limited resources, especially for small enterprises</li>
<li>Need for genuine integration into strategy rather than occasional donations</li>
</ul>
<div class="case"><b>Ghanaian application</b><br>
A mining or manufacturing firm may invest in community schools, health clinics, local employment and environmental rehabilitation. Benefits include social licence to operate and improved relations with host communities. Challenges include cost, ensuring projects are sustainable, and demonstrating that CSR is more than public relations.</div>

<h3>Linking the topics for exam answers</h3>
<p>Strong answers connect the ideas: the internal environment (strengths and weaknesses) interacts with the external environment (opportunities and threats analysed via SWOT and PESTLE). Ethical standards and CSR influence how the firm uses its strengths and responds to external pressures. Growth and business-development decisions should be grounded in this analysis rather than in optimism alone.</p>

<h3>Trial questions</h3>
<ol>
<li>Explain four sources of business opportunities.</li>
<li>Assess the risks of rapid expansion.</li>
<li>Recommend a growth strategy for a small Ghanaian enterprise.</li>
<li>Distinguish the internal environment from the external environment of a business.</li>
<li>Using SWOT, analyse the internal environment of a named or described business.</li>
<li>Explain how PESTLE analysis helps a firm identify opportunities and threats.</li>
<li>Discuss the meaning and importance of business ethics.</li>
<li>Explain the benefits and challenges of Corporate Social Responsibility for a growing Ghanaian firm.</li>
</ol>`}
function internationalContent(){return `<h3>International Business and E-Business</h3><p>International business involves commercial activities across national borders. E-business uses digital technologies to support buying, selling, communication, service and internal processes.</p>
<h3>Market Entry Decisions</h3><p>A business entering another country should consider <b>which market to enter, when to enter, the scale of entry and the entry mode</b>. Entry modes differ in investment, risk, control, speed and profit potential. The Ghana SHS Business Management curriculum specifically covers franchising, joint ventures, licensing and wholly owned subsidiaries.</p>
<h3>1. Exporting</h3><p><b>Meaning:</b> Producing goods/services in the home country and selling them to customers in another country. It may be direct or use foreign distributors/agents.</p><p><b>Advantages:</b> relatively low initial investment; lower commitment than establishing foreign production; allows the firm to test demand; can use existing home-country production capacity.</p><p><b>Disadvantages:</b> transport and logistics costs; tariffs or import restrictions may apply; less control over foreign distribution; exchange-rate and payment risks; weaker local market knowledge.</p><p><b>Best applied when:</b> the firm is new to internationalisation, has limited capital, wants to test a market, or can efficiently produce at home.</p><div class="case"><b>Sample case — Ghanaian food processor</b><br>A Ghanaian fruit-juice producer receives orders from retailers in Togo. Instead of building a factory in Togo, it produces in Ghana and ships finished juice to the retailers. This is exporting. The firm can test demand before committing major foreign investment.</div>
<h3>2. Licensing</h3><p><b>Meaning:</b> The owner of intellectual property such as a patent, technology, trademark or know-how gives a foreign business permission to use it under agreed conditions, normally for royalties or fees.</p><p><b>Advantages:</b> relatively low capital requirement; faster foreign expansion; local licensee contributes market knowledge and resources; useful where direct investment is difficult.</p><p><b>Disadvantages:</b> less operational control; risk of poor quality by the licensee; intellectual-property leakage; the licensee may eventually become a competitor; income is limited by the licensing arrangement.</p><p><b>Best applied when:</b> the firm owns valuable technology/brand knowledge but lacks the resources or desire to establish a full operation abroad.</p><div class="case"><b>Sample case — Ghanaian technology firm</b><br>A Ghanaian software company licenses its proprietary school-management system to a company in Sierra Leone. The foreign company pays agreed royalties and operates under the licence conditions. The Ghanaian firm expands without building a full subsidiary.</div>
<h3>3. Franchising</h3><p><b>Meaning:</b> A franchisor gives a franchisee the right to use its brand, business model, products and operating system under agreed standards and fees.</p><p><b>Advantages:</b> rapid expansion; franchisee provides much of the capital; local franchisee contributes local knowledge; franchisor earns fees/royalties; strong standardisation can protect the brand.</p><p><b>Disadvantages:</b> quality-control problems if franchisees fail to follow standards; reputation damage can spread across the network; disputes over fees and operating rules; less direct control than wholly owned operations.</p><p><b>Best applied when:</b> the business model is replicable, the brand is strong and local operators can follow clearly defined standards.</p><div class="case"><b>Sample case — Fast-food expansion</b><br>A Ghanaian fast-food brand allows an entrepreneur in Côte d’Ivoire to operate a restaurant using its name, recipes, training system and operating procedures for agreed fees. The local entrepreneur supplies much of the capital. This illustrates franchising.</div>
<h3>4. Joint Venture</h3><p><b>Meaning:</b> Two or more businesses agree to create or operate a venture together, sharing resources, risks, control and returns according to their agreement. A joint venture may combine a foreign firm's technology/capital with a local partner's market knowledge.</p><p><b>Advantages:</b> shared investment and risk; access to local knowledge and networks; local partner can help navigate culture and regulation; combines complementary skills and resources.</p><p><b>Disadvantages:</b> conflicts over objectives or control; profit must be shared; different organisational cultures may clash; confidential knowledge may be exposed; the venture may fail if partners disagree.</p><p><b>Best applied when:</b> local knowledge is important, regulations favour local participation, or the foreign firm wants to share risk and resources.</p><div class="case"><b>Sample case — Agribusiness partnership</b><br>A Ghanaian agro-processing company and a Nigerian distribution company establish a jointly owned venture to process and distribute selected products in Nigeria. The Ghanaian company contributes processing expertise while the Nigerian partner contributes local distribution networks. This is a joint venture.</div>
<h3>5. Wholly-Owned Subsidiary</h3><p><b>Meaning:</b> A foreign operation is fully owned by the parent company. It can be established through <b>greenfield investment</b> (building a new operation) or <b>acquisition</b> (buying an existing foreign company). The curriculum describes a wholly owned subsidiary as a business fully owned by the parent.</p><p><b>Advantages:</b> maximum ownership and control; stronger control over quality, technology and strategy; parent keeps the subsidiary's residual profits; easier to protect proprietary processes; long-term local presence.</p><p><b>Disadvantages:</b> high capital requirement; high exposure to political, economic and operational risks; difficult market-entry learning; greenfield projects can take time; acquisitions can create integration and culture problems.</p><p><b>Best applied when:</b> the market is strategically important, the firm has substantial resources, strong control is essential, and long-term commitment is justified.</p><div class="case"><b>Sample case — illustrative multinational</b><br>For exam purposes, students may use a multinational establishing a fully controlled local subsidiary as an illustration of the wholly-owned-subsidiary concept. However, do not state that a specific named company is wholly owned unless the current ownership structure has been verified. The key idea is that the parent owns the entire foreign operation.</div>
<h3>6. Acquisition as a route to wholly-owned entry</h3><p><b>Meaning:</b> The entering company buys an existing business in the foreign market and obtains control. It can provide immediate facilities, staff, customers and local knowledge.</p><p><b>Advantages:</b> faster market access; existing customer base; existing workforce and facilities; may eliminate the time required to build from scratch.</p><p><b>Disadvantages:</b> expensive purchase price; integration difficulties; inherited liabilities or weak systems; cultural conflict; expected synergies may not materialise.</p><div class="case"><b>Sample case</b><br>A Ghanaian manufacturing group buys 100% of an established packaging company in a neighbouring country. It immediately controls the acquired firm's operations and integrates it into the group. This is acquisition leading to wholly owned control.</div>
<h3>7. Greenfield Investment</h3><p><b>Meaning:</b> The company establishes a new foreign operation from the ground up, including premises, equipment, systems and recruitment.</p><p><b>Advantages:</b> maximum control over design, technology, culture and processes; operations can be built to the firm's exact standards.</p><p><b>Disadvantages:</b> high cost; slow set-up; high exposure to unfamiliar-market risk; requires strong management capability and local knowledge.</p><div class="case"><b>Sample case</b><br>A Ghanaian manufacturer buys land in another country, constructs a new plant, installs machinery and recruits local employees. Because the facility is built from scratch and fully owned by the parent, it is a greenfield wholly-owned investment.</div>
<h3>Comparing the entry modes</h3><p>As a general decision rule, <b>exporting</b> normally requires the least foreign investment and control, while a <b>wholly-owned subsidiary</b> requires the greatest commitment and gives the greatest control. Licensing and franchising sit between these extremes, while joint ventures share ownership/control and risk. The correct choice depends on resources, desired control, risk tolerance, market conditions, local knowledge, legal restrictions and strategic objectives.</p>
<h3>Exam application guide</h3><ol><li>If capital is limited and the firm wants to test demand → consider exporting.</li><li>If valuable intellectual property can be transferred under controls → consider licensing.</li><li>If a proven business model can be replicated by local operators → consider franchising.</li><li>If local knowledge and shared risk are important → consider a joint venture.</li><li>If maximum control and long-term commitment are essential → consider a wholly-owned subsidiary.</li></ol>
<h3>E-business benefits</h3><ul><li>Wider reach.</li><li>24/7 access.</li><li>Data-driven marketing.</li><li>Convenience and potential cost savings.</li></ul>
<h3>Challenges</h3><p>Cybersecurity, privacy, logistics, digital exclusion, payment risk, fraud and regulatory compliance.</p><h3>Trial questions</h3><ol><li>Distinguish exporting from foreign direct investment.</li><li>Compare licensing, franchising and joint venture using control, risk and investment.</li><li>A Ghanaian firm with substantial capital wants maximum control over a strategically important foreign market. Recommend an entry mode and justify it.</li></ol>`}
function functionalContent(){return `<h3>Functional Areas of Management</h3><p>Major functions include marketing, finance, human resources, production/operations and related information systems. Each has specialist tasks but none operates effectively in isolation.</p><h3>Why coordination matters</h3><p>Marketing creates demand; operations must fulfil it; finance must fund decisions; HR supplies capability. A marketing campaign that doubles orders without operations capacity can reduce service quality.</p><h3>Trial questions</h3><ol><li>Explain the interdependence of marketing and production.</li><li>Assess the role of finance in functional decision-making.</li><li>Explain how HR can support organisational strategy.</li></ol>`}
function contractContent(){return `<h3>Law of Contract</h3><p>A contract is an agreement recognised by law as creating enforceable obligations. For SHS analysis, distinguish a social promise from a legally enforceable agreement.</p><h3>Essential elements</h3><ol><li><b>Offer:</b> a definite promise capable of acceptance. An invitation to treat is generally an invitation to others to make offers.</li><li><b>Acceptance:</b> final and unqualified assent to the offer, communicated or completed according to the nature of the offer.</li><li><b>Consideration:</b> something of legal value supporting a simple contract; it need not normally be economically adequate, but must be sufficient in law.</li><li><b>Intention to create legal relations:</b> parties must intend legal consequences; domestic/social arrangements are commonly presumed not to have that intention.</li><li><b>Capacity:</b> parties must have legal capacity, subject to rules protecting certain persons.</li><li><b>Legality:</b> the purpose and terms must not be illegal or contrary to public policy.</li><li><b>Certainty/completeness:</b> obligations should be sufficiently clear.</li><li><b>Genuine consent:</b> consent may be affected by factors such as misrepresentation, duress or undue influence.</li><li><b>Formalities:</b> some transactions require special form under law.</li></ol>
<h3>Relevant legal cases</h3>${legalCases.map(c=>`<div class="case"><b>${c.title} — ${c.cite}</b><br><span class="pill">${c.point}</span><br>${c.text}</div>`).join("")}
<h3>Breach of contract</h3><p>Breach occurs when a party fails to perform a contractual obligation. It may be <b>actual</b> (failure when performance is due) or <b>anticipatory</b> (clear indication before the due date that the party will not perform). A condition is generally a major term; breach may allow termination plus damages. A warranty is generally a lesser term; breach normally gives damages rather than termination. The actual legal effect depends on the contract and applicable law.</p>
<h3>Remedies</h3><ul><li><b>Damages:</b> monetary compensation for legally recoverable loss.</li><li><b>Specific performance:</b> court order requiring performance; generally discretionary and more likely where damages are inadequate.</li><li><b>Injunction:</b> order restraining or requiring specified conduct where appropriate.</li><li><b>Rescission:</b> setting aside a contract in appropriate circumstances, such as certain misrepresentation situations.</li><li><b>Restitution:</b> restoring benefits where the law permits, especially when a contract is unwound or an unjust enrichment issue arises.</li></ul>
<h3>Dispute resolution</h3><p><b>Negotiation</b> is direct discussion. <b>Mediation</b> uses a neutral facilitator who normally does not impose a decision. <b>Conciliation</b> similarly assists settlement and may involve a more interventionist conciliator depending on the process. <b>Arbitration</b> involves a neutral arbitrator determining the dispute under the parties' agreement and applicable rules.</p>
<h3>Exam tip</h3><p>For a case, identify the legal issue first, state the rule, apply the facts, then conclude. Do not write only the definition.</p>
<h3>Trial questions</h3><ol><li>Explain five essential elements of a valid contract and illustrate each.</li><li>Distinguish a condition from a warranty and discuss the remedies.</li><li>Using Hadley v Baxendale, explain remoteness of damages.</li></ol>`}
function riskContent(){return `<h3>Business Risk and Insurance</h3><p>Business risk is uncertainty about events that may cause loss, prevent objectives or create unexpected costs. Risk management identifies, assesses, controls and monitors exposures.</p><h3>Types of risk</h3><ul><li>Pure and speculative risk.</li><li>Strategic, operational, financial and compliance risk.</li><li>Internal and external risk.</li></ul><h3>Risk responses</h3><p>Avoid, reduce/control, transfer, accept/retain and share risk where appropriate.</p><h3>Insurance principles</h3><ul><li>Utmost good faith.</li><li>Insurable interest.</li><li>Indemnity for relevant policies.</li><li>Contribution.</li><li>Subrogation.</li><li>Proximate cause.</li></ul><h3>Trial questions</h3><ol><li>Differentiate risk avoidance from risk transfer.</li><li>Explain five insurance principles.</li><li>Develop a risk register for a small business.</li></ol>`}
function hrContent(){return `
<h3>Human Resource Management</h3>
<p>HRM is the systematic management of people so that employee capability, motivation and behaviour support organisational objectives. In Ghanaian SHS Business Management, HRM covers planning for people, attracting them, developing them and managing their performance and welfare.</p>
<h3>Core activities</h3>
<ul>
<li>Human resource planning (forecasting demand and supply of labour).</li>
<li>Job analysis, job description and person specification.</li>
<li>Recruitment and selection.</li>
<li>Induction and training.</li>
<li>Performance management and appraisal.</li>
<li>Compensation, rewards and motivation.</li>
<li>Employee relations, welfare, health and safety, and discipline.</li>
<li>Career and succession planning.</li>
</ul>
<h3>Job analysis</h3>
<p>Job analysis is the systematic study of a job to identify its duties, responsibilities, working conditions and the competencies required. It produces a <b>job description</b> (what the job involves) and a <b>person specification</b> (the qualities the ideal candidate should have). Without job analysis, recruitment becomes guesswork.</p>
<h3>Recruitment vs selection</h3>
<p><b>Recruitment</b> is attracting a pool of suitable candidates. <b>Selection</b> is choosing the most suitable person from that pool. Good practice uses consistent criteria, structured interviews and documented decisions to reduce bias and improve person–job fit.</p>
<h3>Induction and training</h3>
<p>Induction introduces the new employee to the organisation, role, colleagues and rules. Training develops knowledge and skills. Poor induction and training are linked to high early turnover and quality problems — a common issue in rapidly growing Ghanaian firms that hire urgently for export or seasonal orders.</p>
<h3>Performance management</h3>
<p>Setting clear expectations, monitoring performance, giving feedback and linking results to development or rewards. Weak performance systems leave employees unclear about standards and managers unable to correct problems early.</p>
<div class="case"><b>Ghanaian example</b><br>A garment exporter hires ten machine operators in two weeks without job analysis or structured interviews to meet an overseas order. Within months several resign and defect rates rise. The HR lesson: urgent hiring still needs basic job analysis, clear selection criteria and induction if quality and retention matter.</div>
<h3>Trial questions</h3>
<ol>
<li>Distinguish recruitment from selection.</li>
<li>Explain why induction matters for a new employee and for the firm.</li>
<li>Assess the consequences of poor performance management.</li>
<li>Explain the purpose of job analysis before advertising a vacancy.</li>
</ol>`}
function leadershipContent(){return `<h3>Leadership</h3><p>Leadership is the process of influencing people to work willingly and effectively toward shared objectives.</p><h3>Leadership theories</h3><ul><li><b>Trait theory:</b> focuses on qualities associated with effective leaders. Limitation: traits alone do not explain every situation.</li><li><b>Behavioural theory:</b> focuses on what leaders do, such as task and people-oriented behaviours.</li><li><b>Contingency/situational theory:</b> effectiveness depends on the match between leadership behaviour and the situation.</li><li><b>Path-goal approach:</b> leaders clarify the path to goals, remove obstacles and adapt behaviour to followers and tasks.</li></ul>
<h3>Leadership styles</h3><h4>Autocratic</h4><p>Leader makes decisions with limited subordinate participation. Useful in emergencies or where quick direction is required; may reduce participation and commitment.</p>
<h4>Democratic</h4><p>Employees participate in decisions. Can improve commitment and ideas, but may be slower.</p>
<h4>Laissez-faire</h4><p>Employees receive substantial freedom. Can work with highly competent teams but may create weak coordination.</p>
<h4>Bureaucratic</h4><p>Leadership emphasises rules, procedures and formal authority. Useful where compliance is critical; can become rigid.</p>
<h4>Paternalistic</h4><p>Leader acts like a protective parent, making decisions while considering employees' welfare. Can build loyalty but may create dependence.</p>
<h4>Transformational</h4><p>Transforms followers through vision, inspiration and development. Key ideas include <b>idealised influence</b>, <b>inspirational motivation</b>, <b>intellectual stimulation</b> and <b>individualised consideration</b>. Benefits include innovation, commitment and organisational change. Risks include overdependence on a charismatic leader and change fatigue.</p>
<h4>Transactional</h4><p>Based on exchanges between leader and followers. <b>Contingent reward</b> links performance to agreed rewards, while <b>management-by-exception</b> focuses on deviations and corrective action. Effective for clear targets and routine performance, but may not generate deep commitment or innovation.</p>
<h4>Servant leadership</h4><p>The leader puts service, listening, empathy, stewardship and employee development at the centre. It can build trust and people development, but may be slower where urgent command decisions are needed.</p>
<h4>Situational leadership</h4><p>The leader adapts direction/support according to follower competence, commitment and task demands.</p>
<h3>Sources of power</h3><p>Legitimate, reward, coercive, expert and referent power are common categories. Strong leaders understand when each source is appropriate and its risks.</p>
<h3>Centralisation vs decentralisation</h3><p><b>Centralisation</b> concentrates decision authority at higher levels. <b>Decentralisation</b> distributes meaningful decision authority downward and/or geographically.</p><p>Decentralisation can improve speed, local responsiveness and manager development. Challenges include inconsistent decisions and reduced standardisation. Choice depends on size, geographic spread, competence, urgency, desired control, standardisation, technology and organisational culture.</p>
<h3>Trial questions</h3><ol><li>Compare transformational and transactional leadership.</li><li>Assess servant leadership in a school or business setting.</li><li>Recommend centralisation or decentralisation for a growing multi-branch enterprise.</li></ol>`}
function marketingContent(){return `<h3>Marketing — detailed notes</h3><p>Marketing is the process of understanding customer needs, creating value, communicating it and making products/services available in ways that achieve organisational and customer objectives. Modern marketing is more than advertising: it begins with customer and market understanding.</p>
<h3>Marketing concept</h3><p>The marketing concept places customer needs at the centre while seeking sustainable organisational objectives. It encourages research before production and continuous feedback after sales.</p>
<h3>Importance / benefits of marketing</h3><ul><li>Identifies customer needs and opportunities.</li><li>Creates awareness and demand.</li><li>Supports sales and revenue generation.</li><li>Builds brands and customer relationships.</li><li>Provides information for product decisions.</li><li>Helps firms respond to competitors.</li><li>Supports market expansion and business growth.</li></ul>
<h3>Marketing process/functions</h3><ol><li>Market research and environmental analysis.</li><li>Segmentation and target-market selection.</li><li>Positioning and value proposition.</li><li>Product/service planning.</li><li>Pricing.</li><li>Promotion/communication.</li><li>Distribution and logistics.</li><li>Customer service and relationship management.</li><li>Evaluation using sales, profit, satisfaction and other measures.</li></ol>
<h3>Market segmentation</h3><p>Market segmentation is dividing a broad market into relatively distinct groups with similar needs, characteristics or behaviours so the business can serve them more effectively.</p>
<h4>Types/bases</h4><ul><li><b>Demographic:</b> age, sex, income, occupation, education, family size.</li><li><b>Geographic:</b> region, climate, urban/rural location, population density.</li><li><b>Psychographic:</b> lifestyle, personality, values, interests.</li><li><b>Behavioural:</b> usage rate, purchase occasion, loyalty, benefits sought, readiness to buy.</li><li><b>Firmographic:</b> for B2B markets, industry, company size and location.</li></ul>
<h3>Target market</h3><p>A target market is the customer group a firm deliberately selects to serve. Selection should consider size, growth, profitability, accessibility, competition, strategic fit and the firm's resources.</p>
<h4>Targeting strategies</h4><ul><li><b>Undifferentiated/mass:</b> one broad offer for the whole market.</li><li><b>Differentiated:</b> different offers for multiple segments.</li><li><b>Concentrated/niche:</b> focus strongly on one segment.</li><li><b>Micromarketing:</b> highly tailored offers to local or individual needs.</li></ul>
<h3>Positioning</h3><p>Positioning is designing the offer and communication so the product occupies a clear, desirable and distinctive place in the customer's mind relative to competitors.</p>
<h3>Marketing mix</h3><p>The traditional 4Ps are <b>Product, Price, Place and Promotion</b>. For services, the expanded 7Ps add <b>People, Process and Physical Evidence</b>.</p>
<h3>Challenges of marketing</h3><ul><li>Changing customer tastes.</li><li>Strong competition.</li><li>Limited research budgets.</li><li>Digital misinformation and reputation risk.</li><li>Rising advertising costs.</li><li>Regulatory and ethical requirements.</li><li>Difficulty measuring some promotional effects.</li><li>Economic conditions and purchasing-power changes.</li></ul>
<h3>Ghanaian application</h3><p>A Ghanaian jersey shop could segment by age, football interest, income and purchase behaviour; select students and football fans as target groups; position authentic jerseys as premium products; and adjust product, price, place and promotion accordingly.</p>
<h3>Trial questions</h3><ol><li>Explain four bases of market segmentation with examples.</li><li>Assess the factors a business should consider before selecting a target market.</li><li>Develop a 7Ps strategy for a Ghanaian service business.</li></ol>`}
function financeContent(){return `
<h3>Business Finance</h3>
<p>Business finance concerns obtaining, allocating and controlling funds to achieve business objectives. Good financial management balances liquidity (ability to pay short-term obligations), profitability and risk.</p>
<h3>Sources of finance</h3>
<ul>
<li><b>Owner's capital / equity</b> — permanent capital; no fixed repayment, but owners expect a return and may share control.</li>
<li><b>Retained earnings</b> — profits kept in the business; no interest, but limited by past performance.</li>
<li><b>Bank loans and overdrafts</b> — debt finance; interest cost and repayment pressure; overdrafts suit short-term needs.</li>
<li><b>Trade credit</b> — buying now and paying suppliers later; useful for working capital if terms are favourable.</li>
<li><b>Leasing</b> — use of an asset without full ownership purchase; spreads cost but may be more expensive long term.</li>
<li><b>Share capital</b> — for companies; can raise larger sums but dilutes ownership.</li>
<li><b>Microfinance, family and other lawful sources</b> — often important for small Ghanaian enterprises.</li>
</ul>
<h3>Equity vs debt</h3>
<p><b>Equity</b> is ownership finance (no contractual repayment). <b>Debt</b> must be repaid with interest and increases financial risk if cash flow is weak. A profitable firm can still fail if cash arrives too slowly to meet debt and supplier obligations.</p>
<h3>Cash-flow problems</h3>
<p>Profit is not the same as cash. A business that sells on long credit while paying suppliers quickly can run out of cash even when accounts show a profit. Solutions include faster collection, better credit control, negotiating supplier terms, and matching the type of finance to the need (short-term finance for working capital, longer-term finance for machinery).</p>
<h3>Investment decisions</h3>
<p>When choosing projects or assets, management should consider expected cash inflows and outflows, risk, cost of capital, strategic fit and alternatives. Simple comparison of total profit is not enough if timing and risk differ.</p>
<div class="case"><b>Ghanaian example</b><br>A bakery is profitable on paper but customers pay after 60 days while flour suppliers demand payment in 14 days. A short-term loan may ease the immediate gap, but the underlying problem is the mismatch in credit terms — so collection and supplier negotiation matter as much as borrowing.</div>
<h3>Trial questions</h3>
<ol>
<li>Distinguish equity from debt finance.</li>
<li>Explain why a profitable business can still fail from poor cash flow.</li>
<li>Assess factors affecting an investment decision.</li>
<li>Recommend suitable sources of finance for a small Ghanaian firm buying new equipment.</li>
</ol>`}
function productionContent(){return `
<h3>Production and Operations</h3>
<p>Production transforms inputs (materials, labour, machines, information) into goods or services. Operations management coordinates resources, processes, quality, capacity, inventory and delivery so that customer needs are met efficiently.</p>
<h3>Key issues</h3>
<ul>
<li>Product and service design</li>
<li>Capacity planning (how much can we produce?)</li>
<li>Process selection and layout</li>
<li>Quality management</li>
<li>Inventory control</li>
<li>Productivity and efficiency</li>
<li>Maintenance and scheduling</li>
</ul>
<h3>Productivity vs production</h3>
<p><b>Production</b> is the volume of output. <b>Productivity</b> relates output to the resources used (for example units per worker or per cedi of cost). Raising output while waste and defects rise may increase production but reduce true productivity and damage the brand.</p>
<h3>Quality</h3>
<p>Quality means meeting agreed standards and customer expectations. Causes of poor quality include weak design, untrained staff, poor materials, inadequate maintenance, rushed processes and weak inspection or process control. Prevention (getting it right first time) is usually stronger than relying only on final inspection.</p>
<h3>Inventory</h3>
<p>Too little inventory risks stock-outs and lost sales; too much ties up cash and storage space and risks damage or obsolescence. Good operations balance availability with cost.</p>
<div class="case"><b>Ghanaian example</b><br>A school-uniform manufacturer increases output quickly to meet term demand but skips proper sizing checks. Defect rates and returns rise. Customers switch to competitors. The lesson: capacity expansion without quality control harms both productivity and reputation.</div>
<h3>Trial questions</h3>
<ol>
<li>Distinguish productivity from production.</li>
<li>Explain five causes of poor quality.</li>
<li>Recommend ways a small manufacturer can reduce waste.</li>
<li>Explain why increasing output is not always an improvement in performance.</li>
</ol>`}
function entrepreneurshipContent(){return `
<h3>Entrepreneurship</h3>
<p>Entrepreneurship is the process of identifying a business opportunity, organising resources and taking calculated risks to create and grow a venture. An <b>entrepreneur</b> is the person who initiates and drives that process.</p>
<h3>Characteristics of successful entrepreneurs</h3>
<ul>
<li>Opportunity-seeking and initiative</li>
<li>Willingness to take calculated (not reckless) risks</li>
<li>Creativity and problem-solving</li>
<li>Persistence and resilience</li>
<li>Self-confidence and decision-making ability</li>
<li>Ability to mobilise and manage resources</li>
<li>Customer focus and adaptability</li>
</ul>
<h3>Sources of business ideas</h3>
<ul>
<li>Personal skills, hobbies and experience</li>
<li>Customer complaints and unmet needs</li>
<li>Changes in technology, fashion or regulation</li>
<li>Gaps in local markets (for example packaging, logistics, digital services)</li>
<li>Research, trade fairs and observation of successful models elsewhere</li>
</ul>
<h3>The business plan (outline)</h3>
<p>A business plan is a structured document that describes the business idea, market, operations, organisation, finance and risk. Typical sections include: executive summary, business description, market analysis, marketing plan, operations plan, management team, financial projections and funding needs. Even a short plan helps the entrepreneur test whether the idea is realistic before committing large resources.</p>
<h3>Challenges facing entrepreneurs in Ghana</h3>
<ul>
<li>Limited access to affordable finance</li>
<li>High cost or unstable supply of inputs</li>
<li>Infrastructure constraints (power, transport, internet in some areas)</li>
<li>Regulatory and tax compliance burdens for small firms</li>
<li>Competition from imports and larger firms</li>
<li>Skills gaps in management, marketing and record-keeping</li>
<li>Difficulty building trust and reliable customer/supplier networks</li>
</ul>
<h3>Support and success factors</h3>
<p>Training, mentoring, microfinance, trade associations, digital platforms and careful cash-flow management all help. Successful ventures usually start with a clear customer need, control costs early, keep simple records and reinvest profits carefully.</p>
<div class="case"><b>Ghanaian example</b><br>A young graduate notices that small restaurants struggle to get reliable bulk packaging. She starts a small packaging supply business, begins with a narrow product range, keeps tight credit control and expands only after cash flow stabilises. The idea came from observing a real customer problem, not from copying a foreign model blindly.</div>
<h3>Trial questions</h3>
<ol>
<li>Explain five characteristics of a successful entrepreneur.</li>
<li>Identify four sources of business ideas with local examples.</li>
<li>Outline the main sections of a simple business plan and explain why each matters.</li>
<li>Assess three challenges facing young entrepreneurs in Ghana and suggest how each might be reduced.</li>
</ol>`}
function communicationContent(){return `
<h3>Communication in Business</h3>
<p>Business communication is the process of exchanging information, ideas and instructions so that organisational objectives can be achieved. Effective communication supports planning, coordination, motivation, customer service and control.</p>
<h3>Types / directions of communication</h3>
<ul>
<li><b>Downward:</b> from managers to subordinates (instructions, policies, feedback).</li>
<li><b>Upward:</b> from subordinates to managers (reports, suggestions, problems).</li>
<li><b>Horizontal / lateral:</b> between people or departments at similar levels (coordination).</li>
<li><b>Diagonal / external:</b> across levels or with outsiders (customers, suppliers, regulators).</li>
</ul>
<h3>Formal vs informal</h3>
<p><b>Formal</b> communication follows official channels and records (memos, reports, meetings, official email). <b>Informal</b> communication (the grapevine) is unofficial; it can spread information quickly but may also spread rumour. Good managers use formal channels clearly and do not ignore informal networks.</p>
<h3>Channels and media</h3>
<p>Face-to-face, telephone, written letters/memos, email, messaging apps, notice boards, reports and meetings. The choice depends on urgency, complexity, need for a record, cost and the audience.</p>
<h3>Barriers to effective communication</h3>
<ul>
<li>Unclear language or jargon</li>
<li>Noise and physical distractions</li>
<li>Emotional barriers (fear, anger, distrust)</li>
<li>Status differences that discourage upward feedback</li>
<li>Information overload</li>
<li>Poor listening</li>
<li>Cultural or language differences</li>
<li>Wrong choice of channel (for example a long complicated instruction sent only by brief text message)</li>
</ul>
<h3>Improving communication</h3>
<ul>
<li>Be clear and concise; define key terms</li>
<li>Choose the right channel and timing</li>
<li>Encourage feedback and questions</li>
<li>Listen actively</li>
<li>Keep appropriate records</li>
<li>Match the message to the audience</li>
<li>Reduce unnecessary hierarchy barriers where possible</li>
</ul>
<div class="case"><b>Ghanaian example</b><br>A multi-branch retail firm issues a price-change instruction only by WhatsApp voice note. Some branch managers miss it; others misunderstand the start date. Customers are charged differently in different shops. A short written notice plus confirmation from each branch would have reduced the error.</div>
<h3>Trial questions</h3>
<ol>
<li>Distinguish downward, upward and horizontal communication.</li>
<li>Explain four barriers to effective communication in a business.</li>
<li>Recommend how a manager can improve communication when introducing a new work procedure.</li>
<li>Assess the advantages and disadvantages of informal communication in an organisation.</li>
</ol>`}
function governmentContent(){return `
<h3>Government and Business</h3>
<p>Government influences business through laws, policies, taxes, spending, regulation and ownership of enterprises. Understanding this relationship helps explain both opportunities and constraints facing private firms and state-owned enterprises in Ghana.</p>
<h3>Ways government affects business</h3>
<ul>
<li><b>Regulation and law:</b> company law, employment law, consumer protection, environmental rules, licensing.</li>
<li><b>Taxation:</b> corporate tax, VAT, customs duties — affect costs, prices and investment decisions.</li>
<li><b>Spending and procurement:</b> government contracts can be a major market for suppliers.</li>
<li><b>Monetary and macroeconomic policy:</b> interest rates, exchange-rate conditions and inflation affect borrowing and demand.</li>
<li><b>Trade policy:</b> tariffs, export promotion, regional trade agreements (for example within ECOWAS).</li>
<li><b>Infrastructure and public services:</b> power, roads, education and health affect business costs and productivity.</li>
<li><b>Ownership:</b> state-owned enterprises and public–private arrangements.</li>
<li><b>Support programmes:</b> training, SME schemes, agricultural support, industrial policy.</li>
</ul>
<h3>Why government intervenes</h3>
<ul>
<li>Protect consumers and workers</li>
<li>Raise revenue</li>
<li>Promote fair competition and control monopoly power</li>
<li>Encourage development in priority sectors</li>
<li>Correct market failures and provide public goods</li>
<li>Stabilise the economy</li>
</ul>
<h3>Effects on business</h3>
<p>Supportive policy can lower barriers and open markets. Heavy or unpredictable regulation, high taxes or unstable macro conditions can raise costs and discourage investment. Firms need to scan the policy environment (part of PESTLE) when planning expansion, pricing and financing.</p>
<div class="case"><b>Application</b><br>A local manufacturer of school materials may benefit from government procurement and “buy local” preferences, but must also comply with quality standards and tax rules. A change in import duties on raw materials can raise costs overnight — so external monitoring matters.</div>
<h3>Trial questions</h3>
<ol>
<li>Explain four ways government influences business activity.</li>
<li>Discuss two benefits and two challenges of government regulation for private firms.</li>
<li>Assess how tax and trade policy can affect a Ghanaian exporter.</li>
</ol>`}

function getSetObjectives(set){
 const shift=(set*17)%objTopics.length;return Array.from({length:50},(_,i)=>objTopics[(i+shift)%objTopics.length]);
}
function buildEssayQuestions(set){
 const pools=[
 [["(a) Explain four factors that influence the choice between centralisation and decentralisation. (4 marks)","(b) Analyse three advantages of decentralisation to a multi-branch business. (5 marks)","(c) Evaluate the argument that decentralisation always improves efficiency. (6 marks)"],
 ["(a) Distinguish market segmentation from target marketing. (3 marks)","(b) Explain four bases of segmentation with suitable business examples. (5 marks)","(c) Assess the criteria a firm should use when selecting a target market. (7 marks)"],
 ["(a) State three essential elements of a contract. (3 marks)","(b) Explain how an offer differs from an invitation to treat. (5 marks)","(c) Using one relevant case, analyse how courts determine whether a contract was formed. (7 marks)"],
 ["(a) Explain three differences between transformational and transactional leadership. (4 marks)","(b) Discuss three benefits and two limitations of servant leadership. (5 marks)","(c) Recommend a leadership approach for a rapidly changing organisation and justify your choice. (6 marks)"],
 ["(a) Explain three advantages of partnership. (4 marks)","(b) Analyse three limitations of sole proprietorship. (5 marks)","(c) Advise an entrepreneur choosing between partnership and company formation. (6 marks)"],
 ["(a) Define business risk and distinguish it from uncertainty. (3 marks)","(b) Explain four methods of managing business risk. (5 marks)","(c) Assess the role of insurance as a risk-management tool rather than a substitute for risk prevention. (7 marks)"]]
 ];
 return pools[(set+0)%pools.length];
}

/* Restore session on refresh so the user stays logged in.
   Only show the login screen when no saved user exists. */
(function init(){
  const u = getUser();
  const valid = u && u.name && u.id && u.role;
  if (valid) {
    boot();
  } else {
    try{localStorage.removeItem("bm_user");}catch(e){}
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("appHeader").classList.add("hidden");
    document.getElementById("app").classList.add("hidden");
    document.getElementById("drawer").classList.add("hidden");
  }
})();
</script>
</body>
</html>
